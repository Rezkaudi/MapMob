@if (isBusy()) {
  <div data-role="page-lock" class="fixed inset-0 z-[60] cursor-progress" aria-busy="true">
    <div
      role="progressbar"
      aria-label="جاري التنفيذ"
      class="absolute inset-x-0 top-0 h-0.5 overflow-hidden bg-primary-soft"
    >
      <span class="app-route-progress-bar block h-full w-1/3 bg-primary"></span>
    </div>
  </div>
}
