<div class="relative">
  <!-- RTL puts the first child on the right: avatar, then the name block, then the chevron. -->
  <button
    type="button"
    class="flex items-center gap-1"
    aria-haspopup="menu"
    [attr.aria-expanded]="isOpen()"
    (click)="toggle()"
  >
    <app-avatar [name]="userName()" [imageUrl]="avatarUrl()" [size]="48" />
    <span class="flex flex-col items-end justify-center gap-1 text-right">
      <span class="text-[16px]/[24px] font-medium whitespace-nowrap text-text-navy">
        {{ userName() }}
      </span>
      <span class="text-[14px]/[20px] text-text-muted">{{ userRole() }}</span>
    </span>
    <app-icon name="chevron-left" [size]="16" class="text-text-primary" />
  </button>

  @if (isOpen()) {
    <div
      role="menu"
      class="absolute end-0 top-full z-20 mt-2 w-56 rounded-xl border border-border bg-surface py-2 shadow-panel"
    >
      @for (item of items; track item.route) {
        <a
          role="menuitem"
          [routerLink]="item.route"
          class="flex items-center gap-3 px-4 py-2.5 text-[14px] text-text-primary hover:bg-surface-muted"
          (click)="close()"
        >
          <app-icon [name]="item.icon" [size]="18" class="text-text-secondary" />
          <span>{{ item.label }}</span>
        </a>
      }

      <hr class="my-2 border-border" />

      <button
        type="button"
        role="menuitem"
        class="flex w-full items-center gap-3 px-4 py-2.5 text-[14px] font-medium text-error hover:bg-error-soft"
        (click)="signOut()"
      >
        <app-icon name="export" [size]="18" />
        <span>تسجيل الخروج</span>
      </button>
    </div>
  }
</div>
