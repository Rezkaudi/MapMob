<!-- RTL puts the first child on the right, so the search sits right and the account cluster left. -->
<header
  class="flex items-center justify-between bg-surface px-6 py-2 backdrop-blur-[6px] drop-shadow-[0_1px_1px_rgba(0,0,0,0.05)]"
>
  <app-search-input placeholder="البحث" class="w-[340px]" />

  <div class="flex items-center gap-6">
    <button type="button" class="relative text-text-primary" aria-label="الإشعارات">
      <app-icon name="notification" [size]="24" />
      <span class="absolute end-0 top-0 h-2 w-2 rounded-full bg-error"></span>
    </button>

    <button type="button" class="flex items-center gap-1">
      <app-avatar [name]="userName()" [imageUrl]="avatarUrl()" [size]="48" />
      <span class="flex w-12 flex-col items-end justify-center gap-1 text-right">
        <span class="w-full text-[16px]/[24px] font-medium text-text-navy">{{ userName() }}</span>
        <span class="w-full text-[14px]/[20px] text-text-muted">{{ userRole() }}</span>
      </span>
      <app-icon name="chevron-left" [size]="16" class="text-text-primary" />
    </button>
  </div>
</header>
