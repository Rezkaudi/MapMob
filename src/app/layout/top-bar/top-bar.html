<!-- RTL puts the first child on the right, so the search sits right and the account cluster left. -->
<header
  class="flex items-center justify-between bg-surface px-6 py-2 backdrop-blur-[6px] drop-shadow-[0_1px_1px_rgba(0,0,0,0.05)]"
>
  <app-search-input placeholder="البحث" class="w-[340px]" />

  <div class="flex items-center gap-6">
    <!-- The exported bell already carries its red dot, so it renders as an image, not a mask. -->
    <button type="button" aria-label="الإشعارات">
      <img src="assets/icons/notification.svg" alt="" class="h-6 w-6" />
    </button>

    <app-user-menu [userName]="userName()" [userRole]="userRole()" [avatarUrl]="avatarUrl()" />
  </div>
</header>
