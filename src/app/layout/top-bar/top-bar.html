<header class="flex items-center justify-between gap-4 border-b border-border bg-surface px-8 py-4">
  <div class="flex items-center gap-3">
    <button
      type="button"
      class="flex items-center gap-2 rounded-xl px-2 py-1 hover:bg-surface-muted"
    >
      <app-avatar [name]="userName()" [imageUrl]="avatarUrl()" />
      <span class="flex flex-col items-start text-start">
        <span class="text-sm font-semibold text-text-primary">{{ userName() }}</span>
        <span class="text-xs text-text-secondary">{{ userRole() }}</span>
      </span>
      <svg lucideChevronDown class="h-4 w-4 text-text-secondary"></svg>
    </button>

    <button
      type="button"
      class="relative flex h-10 w-10 items-center justify-center rounded-full hover:bg-surface-muted"
      aria-label="الإشعارات"
    >
      <svg lucideBell class="h-5 w-5 text-text-secondary"></svg>
      <span class="absolute end-2.5 top-2.5 h-2 w-2 rounded-full bg-error"></span>
    </button>
  </div>

  <div class="w-full max-w-sm">
    <app-search-input placeholder="البحث" />
  </div>
</header>
