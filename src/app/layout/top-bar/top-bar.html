<!-- RTL puts the first child on the right, so the search sits right and the account cluster left. -->
<header
  class="relative z-30 flex items-center justify-between bg-surface py-2 ps-8 pe-[calc(2rem+var(--scroll-gutter,0px))] backdrop-blur-[6px] drop-shadow-[0_1px_1px_rgba(0,0,0,0.05)]"
>
  <app-search-input placeholder="البحث" class="w-[340px]" />

  <div class="flex items-center gap-6">
    <!-- The bell is multi-colour, so it renders as an image, not a mask. The design's red
         dot is baked into the asset, so an empty inbox swaps in the plain bell instead. -->
    <a
      data-role="inbox"
      routerLink="/inbox"
      [attr.aria-label]="bellLabel()"
      class="rounded focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary"
    >
      <img [src]="bellIcon()" alt="" class="h-6 w-6" />
    </a>

    <app-user-menu [userName]="userName()" [userRole]="userRole()" [avatarUrl]="avatarUrl()" />
  </div>
</header>
