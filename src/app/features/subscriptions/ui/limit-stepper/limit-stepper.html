<!-- RTL: the name on the right, its tag on the left; "+" sits on the right of the number box. -->
<div class="flex flex-col gap-2 rounded-xl border border-border/80 bg-surface-muted p-[14px]">
  <div class="flex items-center justify-between gap-2">
    <span class="text-[12px]/[16px] font-bold text-text-primary">{{ label() }}</span>
    <span class="rounded px-1.5 py-0.5 text-[10px]/[15px] font-bold" [class]="tagClasses()">{{
      tag()
    }}</span>
  </div>

  <div class="flex h-[34px] items-center rounded-lg border border-border bg-surface">
    <button
      type="button"
      class="h-8 rounded-s-lg bg-[#f1f5f9] px-3 text-[14px]/[20px] font-bold text-[#475569] hover:bg-border"
      [attr.aria-label]="'إنقاص ' + label()"
      (click)="step(-1)"
    >
      −
    </button>

    @if (control().value === unlimited) {
      <span class="flex-1 text-center text-[14px]/[20px] font-extrabold text-text-primary">{{
        unlimitedLabel
      }}</span>
    } @else {
      <input
        type="number"
        min="0"
        dir="ltr"
        class="w-full flex-1 bg-surface p-1 text-center text-[14px]/[20px] font-extrabold text-[#1e293b] outline-none"
        [attr.aria-label]="label()"
        [value]="control().value"
        (input)="typeValue($event)"
      />
    }

    <button
      type="button"
      class="h-8 rounded-e-lg bg-[#f1f5f9] px-3 text-[14px]/[20px] font-bold text-[#475569] hover:bg-border"
      [attr.aria-label]="'زيادة ' + label()"
      (click)="step(1)"
    >
      +
    </button>
  </div>
</div>
