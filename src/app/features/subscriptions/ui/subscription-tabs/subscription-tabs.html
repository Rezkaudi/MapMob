<!-- RTL: the tabs sit at the right end of a full-width rule; each leads with its icon. -->
<div role="tablist" class="flex justify-start border-b border-border">
  <div class="flex gap-8">
    @for (tab of tabs(); track tab.id) {
      @let isSelected = tab.id === selected();
      <button
        role="tab"
        type="button"
        [attr.aria-selected]="isSelected"
        class="flex items-center gap-2 border-b-2 py-3 text-[14px]/[20px] font-bold"
        [class]="
          isSelected
            ? 'border-primary px-1 text-primary'
            : 'border-transparent px-1 text-text-secondary'
        "
        (click)="selectedChange.emit(tab.id)"
      >
        <app-icon [name]="tab.icon" [size]="16" aria-hidden="true" />
        <span>{{ tab.label }}</span>
        <!-- The design stretches the chosen tab's count box to 21px, which lifts that tab by 5px. -->
        <span
          class="px-2 py-0.5 text-center text-[12px] font-bold"
          [class]="
            isSelected
              ? 'rounded-xl bg-primary/16 leading-[21px] text-primary'
              : 'rounded-full bg-[#64748B]/16 leading-4'
          "
          >{{ tab.count }}</span
        >
      </button>
    }
  </div>
</div>
