<!-- RTL: the dot and title on the right, the badge on the left; the currency box caps the field's left. -->
<div class="flex flex-col gap-3 rounded-xl p-4" [class]="skin().card">
  <div class="flex items-center justify-between gap-2">
    <span class="flex items-center gap-2">
      <span class="size-2.5 rounded-full" [class]="skin().dot" aria-hidden="true"></span>
      <span class="text-[14px]/[20px] font-bold text-text-primary">{{ title() }}</span>
    </span>
    <span
      data-role="badge"
      class="rounded-full px-2.5 py-0.5 text-[11px]/[16.5px] font-extrabold"
      [class]="skin().badge"
      >{{ badge() }}</span
    >
  </div>

  <!-- The caption names the price alone, so it cannot steal a click from the currency list. -->
  <div class="flex flex-col gap-[3px]">
    <label [attr.for]="priceFieldId" class="text-[12px]/[16px] text-text-secondary">
      {{ priceLabel() }}
    </label>
    <span class="flex h-[42px] items-stretch rounded-lg border border-border bg-surface">
      <app-currency-select
        class="flex"
        variant="cap"
        [label]="priceLabel() + ' — العملة'"
        [currency]="currency()"
        (currencyChange)="currencyChange.emit($event)"
      />
      <input
        type="number"
        min="0"
        dir="ltr"
        class="w-full flex-1 bg-transparent px-3.5 text-right text-[16px]/[24px] font-extrabold text-[#1e293b] outline-none"
        [id]="priceFieldId"
        [value]="control().value"
        (input)="typePrice($event)"
      />
    </span>
  </div>
</div>
