<!-- RTL: the green tick leads each row, the field fills the middle, the bin closes it on the left. -->
<div class="flex flex-col gap-2.5">
  @for (control of features().controls; track $index) {
    <div
      class="flex items-center gap-2.5 rounded-lg border border-border bg-surface-muted/70 p-2.5"
    >
      <span
        class="flex size-7 shrink-0 items-center justify-center rounded-lg bg-[#d1fae5] text-status-success"
        aria-hidden="true"
      >
        <app-icon name="check-thin" [size]="16" />
      </span>

      <input
        type="text"
        [formControl]="control"
        [attr.aria-label]="'الميزة ' + ($index + 1)"
        class="h-[30px] w-full flex-1 rounded-md border border-border bg-surface px-3 text-[12px]/[16px] font-medium text-[#1e293b] outline-none focus:border-primary"
      />

      <button
        type="button"
        class="flex size-7 shrink-0 items-center justify-center rounded-lg text-text-secondary hover:bg-closed/10 hover:text-closed"
        [attr.aria-label]="'حذف الميزة ' + ($index + 1)"
        (click)="removeFeature($index)"
      >
        <app-icon name="trash-outline" [size]="16" aria-hidden="true" />
      </button>
    </div>
  }

  <button
    type="button"
    class="flex h-[38px] items-center justify-center gap-2 rounded-lg border border-primary bg-[#f0f7ff]/40 px-4 text-[12px]/[16px] font-bold text-primary hover:bg-primary-soft"
    (click)="addFeature()"
  >
    <app-icon name="plus" [size]="16" aria-hidden="true" />
    <span>إضافة ميزة</span>
  </button>
</div>
