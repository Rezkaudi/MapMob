<section [id]="feature().id" class="scroll-mt-32 space-y-3">
  <div class="flex flex-wrap items-end justify-between gap-2">
    <div class="space-y-1">
      <h3 class="text-[19px] font-bold text-text-primary">{{ feature().name }}</h3>
      <p class="max-w-[76ch] text-[15px] leading-relaxed text-text-secondary">
        {{ feature().intro }}
      </p>
    </div>
    <p class="flex gap-2 font-code text-[12px] text-text-secondary">
      <span class="rounded bg-surface px-2 py-0.5 ring-1 ring-border"
        >screen {{ feature().screen }}</span
      >
      <span class="rounded bg-surface px-2 py-0.5 ring-1 ring-border">{{ accessLabel() }}</span>
    </p>
  </div>
  <div class="space-y-2">
    @for (endpoint of feature().endpoints; track endpoint.id) {
      <app-endpoint-card
        [feature]="feature()"
        [endpoint]="endpoint"
        [isOpen]="isAllOpen() || openEndpointIds().has(endpoint.id)"
        (toggle)="toggle.emit($event)"
      />
    }
  </div>
</section>
