<div class="overflow-x-auto rounded-lg border border-border">
  <table class="w-full min-w-[560px] border-collapse text-left text-[13px]">
    <thead class="bg-surface-muted text-[12px] tracking-[0.06em] text-text-secondary uppercase">
      <tr>
        <th scope="col" class="w-[26%] px-3 py-2 font-semibold">Name</th>
        <th scope="col" class="w-[26%] px-3 py-2 font-semibold">Type</th>
        <th scope="col" class="w-[12%] px-3 py-2 font-semibold">Need</th>
        <th scope="col" class="px-3 py-2 font-semibold">Notes</th>
      </tr>
    </thead>
    <tbody>
      @for (field of fields(); track field.name) {
        <tr class="border-t border-border align-top">
          <td class="px-3 py-2 font-code text-[13px] font-semibold break-all text-text-primary">
            {{ field.name }}
          </td>
          <td class="px-3 py-2 font-code text-[12px] break-words text-[#6D28D9]">
            {{ field.type }}
          </td>
          <td class="px-3 py-2">
            <span
              class="rounded px-1.5 py-0.5 text-[12px] font-medium"
              [class]="
                field.isRequired
                  ? 'bg-error-soft text-[#B42318]'
                  : 'bg-surface-muted text-text-secondary'
              "
              >{{ field.isRequired ? 'required' : 'optional' }}</span
            >
          </td>
          <td class="px-3 py-2 leading-relaxed text-text-secondary">{{ field.description }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
