<div class="overflow-x-auto rounded-lg border border-border">
  <table class="w-full border-collapse text-left text-[13px]">
    <thead class="bg-surface-muted text-[12px] tracking-[0.06em] text-text-secondary uppercase">
      <tr>
        @for (heading of table().head; track $index) {
          <th scope="col" class="px-3 py-2 font-semibold">{{ heading }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of table().rows; track $index) {
        <tr class="border-t border-border align-top">
          @for (cell of row; track $index; let first = $first) {
            <td
              class="px-3 py-2 leading-relaxed"
              [class]="first ? 'font-code font-semibold text-text-primary' : 'text-text-secondary'"
            >
              {{ cell }}
            </td>
          }
        </tr>
      }
    </tbody>
  </table>
</div>
