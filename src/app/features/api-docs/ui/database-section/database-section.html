<section [id]="domain().id" class="scroll-mt-32 space-y-3">
  <div class="space-y-1">
    <h3 class="text-[19px] font-bold text-text-primary">{{ domain().name }}</h3>
    <p class="max-w-[76ch] text-[15px] leading-relaxed text-text-secondary">
      {{ domain().description }}
    </p>
  </div>
  <app-erd-diagram [domain]="domain()" />
  <div class="space-y-2">
    @for (table of domain().tables; track table.name) {
      <app-table-dictionary [table]="table" [isForcedOpen]="isPrinting()" />
    }
  </div>
</section>
