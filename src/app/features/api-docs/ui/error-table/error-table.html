<div class="overflow-x-auto rounded-lg border border-border">
  <table class="w-full min-w-[560px] border-collapse text-left text-[13px]">
    <thead class="bg-surface-muted text-[12px] tracking-[0.06em] text-text-secondary uppercase">
      <tr>
        <th scope="col" class="w-[70px] px-3 py-2 font-semibold">Status</th>
        <th scope="col" class="px-3 py-2 font-semibold">When</th>
        <th scope="col" class="w-[40%] px-3 py-2 font-semibold">Body</th>
      </tr>
    </thead>
    <tbody>
      @for (errorCase of cases(); track errorCase.status) {
        <tr class="border-t border-border align-top">
          <td class="px-3 py-2">
            <span
              class="rounded bg-error-soft px-1.5 py-0.5 font-code text-[12px] font-bold text-[#B42318]"
              >{{ errorCase.status }}</span
            >
          </td>
          <td class="px-3 py-2 leading-relaxed text-text-secondary">{{ errorCase.when }}</td>
          <td class="px-3 py-2 font-code text-[12px] break-all text-text-primary" dir="auto">
            {{ bodyOf(errorCase) }}
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
