<div class="grid gap-3 sm:grid-cols-3">
  <div class="rounded-xl border border-white/10 bg-white/[0.06] p-4">
    <p class="text-[13px] text-[#94A3B8]">Endpoints to build</p>
    <p class="mt-1 text-[30px] leading-none font-bold tabular-nums text-white">
      {{ counts().total }}
    </p>
  </div>
  <div class="rounded-xl border border-white/10 bg-white/[0.06] p-4">
    <p class="text-[13px] text-[#94A3B8]">Feature groups</p>
    <p class="mt-1 text-[30px] leading-none font-bold tabular-nums text-white">
      {{ featureCount() }}
    </p>
  </div>
  <div class="rounded-xl border border-white/10 bg-white/[0.06] p-4">
    <p class="text-[13px] text-[#94A3B8]">Database tables</p>
    <p class="mt-1 text-[30px] leading-none font-bold tabular-nums text-white">
      {{ tableCount() }}
    </p>
  </div>
</div>
<div class="mt-5 space-y-3">
  <div class="flex h-2 overflow-hidden rounded-full bg-white/10" aria-hidden="true">
    @for (item of methods(); track item.method) {
      <span class="h-full" [class]="item.bar" [style.width.%]="item.percent"></span>
    }
  </div>
  <ul class="flex flex-wrap gap-x-5 gap-y-2" aria-label="Endpoints by method">
    @for (item of methods(); track item.method) {
      <li class="flex items-center gap-2 text-[13px] text-[#CBD5E1]">
        <i class="size-2 rounded-full" [class]="item.bar" aria-hidden="true"></i>
        <span class="font-code font-semibold text-white">{{ item.method }}</span>
        <span class="tabular-nums">{{ item.count }}</span>
      </li>
    }
  </ul>
</div>
