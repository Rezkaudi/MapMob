<app-action-menu menuStyle="sharp" label="خيارات القصة">
  <!-- RTL: each item leads with its icon on the right, then the label. -->
  <button
    type="button"
    class="flex w-full items-center gap-3 rounded-[2px] px-3 text-[14px]/[20px] text-text-primary hover:bg-surface-muted"
    [class]="viewPadding()"
    (click)="view.emit()"
  >
    <app-icon name="eye-filled" [size]="17" aria-hidden="true" />
    <span>عرض القصة</span>
  </button>
  @if (visibilityItem(); as item) {
    <button
      type="button"
      class="flex w-full items-center gap-3 rounded-[2px] px-3 text-[14px]/[20px] text-text-primary hover:bg-surface-muted"
      [class]="lastItemPadding"
      (click)="visibilityChange.emit()"
    >
      <app-icon [name]="item.icon" [size]="18" aria-hidden="true" />
      <span>{{ item.label }}</span>
    </button>
  }
  <span data-role="menu-divider" class="block h-px bg-border"></span>
  <button
    type="button"
    class="flex w-full items-center gap-3 rounded-[2px] px-3 pt-3 pb-2 text-[14px]/[20px] text-text-primary hover:bg-surface-muted"
    (click)="remove.emit()"
  >
    <app-icon name="trash-filled" [size]="14" class="text-closed" aria-hidden="true" />
    <span>حذف القصة</span>
  </button>
</app-action-menu>
