<button
  type="button"
  class="relative flex h-[61px] w-10 items-center justify-center overflow-hidden rounded-md border border-border bg-[linear-gradient(0deg,#1c1917_0%,#451a03_50%,#44403c_100%)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
  [attr.aria-label]="label()"
  (click)="opened.emit()"
>
  @if (imageUrl(); as url) {
    <img [src]="url" alt="" loading="lazy" class="absolute inset-0 size-full object-cover" />
  }
  <span
    data-role="play-mark"
    class="relative flex size-5 rounded-full bg-white/80 text-[#1e293b] shadow-[0_1px_3px_0_rgba(0,0,0,0.1),0_1px_2px_-1px_rgba(0,0,0,0.1)]"
  >
    <app-icon name="play-solid" [size]="20" />
  </span>
</button>
