<!-- RTL: the search and the chips both start at the right edge. The 124px card counts its border. -->
<div class="flex flex-col gap-6 rounded-xl border border-border bg-surface p-[15px]">
  <app-list-search-field
    class="w-full max-w-[390px]"
    placeholder="ابحث عن متجر..."
    (searchChange)="searchChange.emit($event)"
  />
  <app-filter-chips
    class="overflow-x-auto"
    [options]="chips()"
    [selected]="selectedChip()"
    (selectedChange)="pickChip($event)"
  />
</div>
