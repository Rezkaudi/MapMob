<section class="flex flex-col gap-2">
  <h3 class="text-[12px]/[16px] font-bold tracking-[0.3px] text-text-secondary">
    معلومات العميل (صاحب التقييم)
  </h3>
  <!-- RTL: the initials tile on the right, the details beside it. -->
  <div class="flex items-center gap-3">
    <span
      class="flex size-12 shrink-0 items-center justify-center rounded-2xl bg-accent text-[16px]/[32px] font-bold tracking-[-0.24px] text-white"
      aria-hidden="true"
    >
      {{ initials() }}
    </span>
    <div class="flex min-w-0 flex-col items-start gap-1">
      <p class="text-[14px]/[20px] font-bold text-text-primary">{{ reviewer().name }}</p>
      <p class="pb-1 text-[12px]/[16px] text-text-secondary">{{ metaLabel() }}</p>
      @if (reviewer().isPhoneVerified) {
        <span
          class="rounded bg-status-success/16 px-1.5 text-[10px]/[20px] font-bold text-status-success"
        >
          حساب موثق برقم الجوال
        </span>
      }
    </div>
  </div>
</section>
