<section class="flex flex-col gap-2 rounded-xl border border-[#f1f5f9] bg-surface-muted p-4">
  <h3 class="text-[12px]/[16px] font-bold tracking-[0.3px] text-text-secondary">
    الشركة المستهدفة بالتقييم
  </h3>
  <!-- RTL: the place on the right, its reference number on the left. -->
  <div class="flex items-center justify-between gap-4">
    <div class="flex min-w-0 flex-col gap-1">
      <p class="text-[16px]/[24px] font-bold text-text-primary">{{ place().name }}</p>
      <p class="truncate text-[12px]/[16px] text-text-secondary">{{ metaLabel() }}</p>
    </div>
    <span
      dir="ltr"
      class="shrink-0 rounded-lg bg-primary-tint px-2 py-1 text-[12px]/[16px] font-bold text-primary"
    >
      {{ referenceLabel() }}
    </span>
  </div>
</section>
