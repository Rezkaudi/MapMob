<section
  id="review-filter-panel"
  role="dialog"
  aria-labelledby="review-filter-panel-title"
  class="flex w-[384px] max-w-[calc(100vw-32px)] flex-col rounded-2xl border border-border bg-white pt-3 shadow-[0_4px_12px_0_rgba(15,23,42,0.06),0_12px_36px_0_rgba(15,23,42,0.12)]"
>
  <!-- RTL: the badge and heading on the right, the cross on the left. -->
  <header class="flex items-center justify-between border-b border-[#f1f5f9] px-3 pb-3">
    <div class="flex items-center gap-2">
      <span class="flex size-7 items-center justify-center rounded-lg bg-primary/10 text-primary">
        <app-icon name="sliders" [size]="16" aria-hidden="true" />
      </span>
      <div class="flex flex-col text-start">
        <h2 id="review-filter-panel-title" class="text-[14px]/[20px] font-bold text-text-primary">
          تصفية التقييمات
        </h2>
        <p class="-mt-px text-[11px]/[16.5px] text-text-secondary">
          تطبيق معايير متعددة لتخصيص نتائج البحث
        </p>
      </div>
    </div>
    <button
      type="button"
      aria-label="إغلاق"
      class="flex size-6 items-center justify-center rounded-md text-[#94a3b8] hover:bg-surface-muted"
      (click)="closed.emit()"
    >
      <app-icon name="close-thin" [size]="24" aria-hidden="true" />
    </button>
  </header>

  <div class="my-[27px] flex flex-col gap-4 px-[30px]">
    <div class="flex flex-col gap-1.5">
      <span class="text-[12px]/[16px] font-bold text-text-primary">التقييم</span>
      <app-review-rating-picker [selected]="draft().rating" (selectedChange)="pickRating($event)" />
    </div>

    <div class="flex flex-col gap-1.5">
      <span class="text-[12px]/[16px] font-bold text-text-primary">الحالة</span>
      <app-review-status-picker [selected]="draft().status" (selectedChange)="pickStatus($event)" />
    </div>

    <app-review-place-field [value]="draft().placeName" (valueChange)="changePlaceName($event)" />

    <app-date-period-filter
      heading="الفترة الزمنية"
      [hasFixedWidthFields]="true"
      [period]="draft().period"
      [customRange]="draft().customRange"
      (periodChange)="pickPeriod($event)"
      (customRangeChange)="changeCustomRange($event)"
    />
  </div>

  <!-- RTL: reset on the right, apply on the left. -->
  <footer
    class="flex h-[65px] items-center justify-between rounded-2xl border-t border-[#f1f5f9] bg-surface-muted px-4"
  >
    <button
      type="button"
      class="rounded-md px-2 py-1.5 text-[12px]/[16px] font-bold text-text-secondary hover:text-text-primary"
      (click)="reset()"
    >
      إعادة ضبط
    </button>
    <button
      type="button"
      class="rounded-lg bg-primary px-5 py-2 text-[12px]/[16px] font-bold text-white hover:bg-primary-hover disabled:cursor-not-allowed disabled:opacity-50"
      [disabled]="!canApply()"
      (click)="apply()"
    >
      تطبيق الفلاتر
    </button>
  </footer>
</section>
