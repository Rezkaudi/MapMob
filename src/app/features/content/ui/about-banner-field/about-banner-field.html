<app-content-field-label
  text="صورة عن التطبيق (البانر التعريفي)"
  hint="الصورة أو البانر الترويجي الذي يظهر أعلى شاشة «عن التطبيق» في الواجهة الرئيسية للمستخدمين."
/>

<!-- RTL: justify-end packs the buttons on the left; replace is first, so delete lands leftmost. -->
<div class="mt-0.5 flex h-10 justify-end gap-4">
  <button
    type="button"
    class="flex h-10 items-center gap-2 rounded border border-border bg-white px-4 text-[12px]/[16px] font-bold text-text-primary shadow-[0_4px_30px_0_rgba(0,0,0,0.08)] hover:bg-surface-muted"
    (click)="openPicker()"
  >
    <app-icon name="upload-arrow" [size]="16" aria-hidden="true" />
    <span>{{ banner() ? 'استبدال الصورة' : 'رفع صورة' }}</span>
  </button>
  @if (banner()) {
    <button
      type="button"
      class="flex h-10 items-center gap-2 rounded border border-closed px-4 text-[12px]/[16px] font-bold text-closed shadow-[0_4px_30px_0_rgba(0,0,0,0.08)] hover:bg-closed/5"
      (click)="remove()"
    >
      <app-icon name="trash-outline" [size]="16" aria-hidden="true" />
      <span>حذف</span>
    </button>
  }
</div>

<!-- 16px under the buttons: the 177px dashed frame, the picture contained in a 300×168 white panel. -->
<div
  class="mt-4 flex h-[177px] items-center justify-center overflow-hidden rounded-lg border-2 border-dashed border-[#c0c7d5] bg-white p-8"
>
  @if (banner(); as picked) {
    <div class="flex h-[168px] w-[300px] shrink-0 items-center justify-center rounded-xl bg-white">
      <img
        class="h-[200px] w-[200px] object-contain"
        [src]="picked.previewUrl"
        [alt]="picked.name"
      />
    </div>
  } @else {
    <button
      type="button"
      class="flex flex-col items-center gap-1 text-text-secondary hover:text-primary"
      (click)="openPicker()"
    >
      <app-icon name="image-outline" [size]="32" aria-hidden="true" />
      <span class="text-[14px]/[20px] font-bold">لم يتم رفع صورة بعد</span>
      <span class="text-[12px]/[16px]">الحد الأقصى لحجم الصورة 5 ميجابايت (JPG, PNG)</span>
    </button>
  }
</div>

@if (error(); as message) {
  <p role="alert" class="mt-2 text-start text-[12px]/[16px] text-closed">{{ message }}</p>
}

<input
  #fileInput
  type="file"
  class="sr-only"
  tabindex="-1"
  aria-hidden="true"
  [attr.accept]="accept"
  (change)="pickFromInput($event)"
/>
