@if (saveError(); as error) {
  <app-toast
    tone="error"
    title="تعذر حفظ التغييرات"
    [message]="error"
    (dismissed)="errorDismissed.emit()"
  />
} @else if (isSaved()) {
  <app-toast
    title="تم حفظ التغييرات"
    message="ستظهر التغييرات للمستخدمين داخل التطبيق."
    (dismissed)="savedDismissed.emit()"
  />
}
