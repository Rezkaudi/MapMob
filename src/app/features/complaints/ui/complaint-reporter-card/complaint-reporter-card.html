<app-complaint-detail-card heading="بيانات المُبلّغ">
  <p class="text-[16px]/[28px] text-text-primary">{{ reporter().name }}</p>

  <!-- RTL: each icon leads on the right, 12px before the value. -->
  <div class="flex flex-col gap-1">
    <div class="flex h-[42px] items-center gap-3 rounded-lg bg-[#f2f4f6] px-3">
      <app-icon
        name="mail"
        [size]="15"
        class="text-text-secondary"
        aria-label="البريد الإلكتروني"
      />
      <span data-role="contact" dir="ltr" class="truncate text-[13px]/[18px] text-[#191c1e]">{{
        reporter().email
      }}</span>
    </div>
    <div class="flex h-[42px] items-center gap-3 rounded-lg bg-[#f2f4f6] px-3">
      <app-icon
        name="phone-filled"
        [size]="14"
        class="text-text-secondary"
        aria-label="رقم الهاتف"
      />
      <span data-role="contact" dir="ltr" class="truncate text-[13px]/[18px] text-[#191c1e]">{{
        reporter().phone
      }}</span>
    </div>
  </div>

  <a
    class="flex h-11 items-center justify-center rounded border border-primary bg-white px-4 text-[14px]/[20px] text-primary hover:bg-primary-soft focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
    [routerLink]="profileLink()"
  >
    عرض الملف الشخصي للمستخدم
  </a>
</app-complaint-detail-card>
