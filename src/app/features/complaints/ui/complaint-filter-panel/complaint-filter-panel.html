<!-- The frame reads "تصفية الإشعارات" and "تاريخ التسجيل", copied from other panels; this one filters complaints by report day. -->
<app-filter-popover
  panelId="complaint-filter-panel"
  heading="تصفية البلاغات"
  footerSize="compact"
  [canApply]="canApply()"
  (applied)="apply()"
  (reset)="reset()"
  (closed)="closed.emit()"
>
  <div class="flex flex-col gap-1.5">
    <span class="text-[12px]/[16px] font-bold text-text-primary">الحالة</span>
    <app-choice-chips
      label="الحالة"
      layout="row"
      [options]="statusOptions"
      [selected]="draft().status"
      (selectedChange)="pickStatus($event)"
    />
  </div>

  <app-date-period-filter
    heading="تاريخ البلاغ"
    headingIcon="calendar-outline"
    [hasFixedWidthFields]="true"
    [period]="draft().reportPeriod"
    [customRange]="draft().customRange"
    (periodChange)="pickPeriod($event)"
    (customRangeChange)="changeCustomRange($event)"
  />
</app-filter-popover>
