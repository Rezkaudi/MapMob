<article
  class="flex h-[270px] w-[200px] shrink-0 flex-col overflow-clip rounded-xl border border-border bg-surface shadow-[0_1px_2px_0_rgba(0,0,0,0.05)]"
>
  <div class="relative h-[144px] shrink-0 bg-[#f1f5f9]">
    @if (offer().imageUrl) {
      <app-lazy-image
        [src]="offer().imageUrl"
        [alt]="offer().title"
        imageClass="size-full object-cover"
        class="size-full"
      />
    } @else {
      <div class="flex size-full items-center justify-center text-placeholder">
        <app-icon name="offers" [size]="28" />
      </div>
    }

    <!-- RTL: the design pins the status tag to the far edge, 8px in from the top-left. -->
    <span
      data-testid="offer-status"
      class="absolute top-2 left-2 flex h-[19px] items-center rounded-md px-2 font-cairo text-[10px]/[15px] font-bold text-white"
      [class]="offer().isActive ? 'bg-status-success' : 'bg-text-secondary'"
    >
      {{ offer().isActive ? 'نشط' : 'منتهي' }}
    </span>
  </div>

  <div class="flex flex-1 flex-col p-[14px]">
    <h3 class="truncate text-start text-[12px]/[16.5px] font-bold text-text-primary">
      {{ offer().title }}
    </h3>
    <p class="mt-1 line-clamp-2 text-start text-[11px]/[17.88px] text-text-secondary">
      {{ offer().description }}
    </p>

    <!-- RTL: the calendar icon leads, so the row reads right to left. -->
    <div
      class="mt-auto flex h-7 items-center gap-1 border-t border-[#f1f5f9] pt-3 text-[10px]/[15px] text-text-secondary"
    >
      <app-icon name="calendar" aria-hidden="true" [size]="12" />
      <span>{{ offer().dateRange }}</span>
    </div>
  </div>
</article>
