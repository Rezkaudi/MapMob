<app-info-card heading="الموقع" [canEdit]="true">
  <div class="relative h-[420px] overflow-clip rounded-xl bg-surface-muted">
    <div class="flex size-full items-center justify-center text-placeholder">
      <app-icon name="map" [size]="44" />
    </div>

    <div class="absolute inset-x-4 bottom-4 rounded-xl bg-surface p-4 shadow-panel">
      <p class="text-[14px] font-bold text-text-primary">{{ location().city }}</p>
      <p class="mt-1 text-[13px] text-text-secondary">{{ location().address }}</p>
    </div>
  </div>
</app-info-card>
