@let item = link();
<article
  class="flex flex-col rounded-xl border border-[rgba(226,232,240,0.8)] bg-surface p-4 shadow-[0_1px_2px_0_rgba(0,0,0,0.05)]"
>
  <div class="flex flex-col gap-3 pb-4">
    <!-- RTL: the logo leads, so it sits on the right edge with the names to its left. -->
    <div class="flex items-center gap-2.5">
      <span
        data-role="platform-logo"
        class="flex size-8 shrink-0 items-center justify-center overflow-hidden rounded-lg bg-accent shadow-[0_1px_2px_0_rgba(0,0,0,0.05)]"
      >
        @if (item.platform.logoUrl; as logoUrl) {
          <img class="size-full object-cover" alt="" [src]="logoUrl" />
        }
      </span>
      <h3 class="flex min-w-0 items-center gap-1.5 text-text-primary">
        <span data-role="platform-name" class="truncate text-[12px]/[16px] font-bold">
          {{ item.platform.name }}
        </span>
        <span
          data-role="platform-latin-name"
          class="shrink-0 text-[11px]/[16px] font-medium"
          dir="ltr"
          >({{ item.platform.latinName }})</span
        >
      </h3>
    </div>

    <div class="flex h-8 items-center rounded-lg border border-[#f1f5f9] bg-surface-muted px-2.5">
      <span
        data-role="store-url"
        dir="ltr"
        class="block min-w-0 flex-1 truncate text-left text-[11px]/[16.5px] text-text-primary"
        [title]="item.storeUrl"
      >
        {{ item.storeUrl }}
      </span>
    </div>
  </div>

  <!-- RTL: "فتح رابط المتجر" comes first so it lands on the right, the copy button on the left. -->
  <div
    data-role="platform-actions"
    class="flex items-center justify-between gap-2 border-t border-[#f1f5f9] pt-2"
  >
    <a
      data-role="open-link"
      target="_blank"
      rel="noopener noreferrer"
      class="flex h-8 w-[158px] items-center justify-center rounded-lg bg-[#f0f7ff] px-3 text-[10px]/[16px] font-bold text-primary transition-colors hover:bg-primary/10 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
      [href]="item.storeUrl"
    >
      فتح رابط المتجر
    </a>
    <button
      data-role="copy-link"
      type="button"
      class="flex h-8 items-center justify-center gap-1 rounded-lg border border-border bg-surface-muted px-3 text-[10px]/[16px] font-medium text-text-secondary transition-colors hover:bg-[#f1f5f9] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
      (click)="copyLink()"
    >
      <app-icon
        aria-hidden="true"
        [name]="hasCopied() ? 'check-thin' : 'copy-feather'"
        [size]="14"
      />
      <span>{{ hasCopied() ? 'تم النسخ' : 'نسخ الرابط' }}</span>
    </button>
  </div>
</article>
