<!--
  The bar stays on screen while the long form scrolls. The negative margins and `-bottom-8`
  pull it through main's 32px padding on all sides, so it sits flush against the edges of the
  scroll area. RTL: `justify-end` packs the buttons against the left edge and the first child
  lands rightmost, so the frame's left-to-right run of "إلغاء، حفظ كمسودة، حفظ المكان" is
  written here back to front.
-->
<div
  data-testid="form-actions"
  class="sticky -bottom-8 z-30 -mx-8 -mb-8 flex items-center justify-end gap-3 border-t border-[#e0e3e5] bg-surface p-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]"
>
  <button
    type="submit"
    class="h-[46px] rounded bg-primary px-4 text-[14px]/[20px] font-medium text-white shadow-[0_1px_2px_0_rgba(0,0,0,0.05)] transition-colors hover:bg-primary-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
  >
    حفظ المكان
  </button>
  <button
    type="button"
    class="h-[46px] rounded border border-border bg-surface px-4 text-[14px]/[20px] font-medium text-[#191c1e] shadow-[0_1px_2px_0_rgba(0,0,0,0.05)] transition-colors hover:bg-surface-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
  >
    حفظ كمسودة
  </button>
  <a
    routerLink="/admin/places"
    class="flex h-[46px] items-center rounded border border-closed px-4 text-[14px]/[20px] font-medium text-closed transition-colors hover:bg-error-soft focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-closed"
  >
    إلغاء
  </a>
</div>
