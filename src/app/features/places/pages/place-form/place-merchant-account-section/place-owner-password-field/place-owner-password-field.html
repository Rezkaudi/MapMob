<!-- RTL: the label sits on the right, the generate button on the left of the same 14px row. -->
<div class="flex items-start justify-between gap-2">
  <app-field-label text="كلمة المرور" forId="owner-password" [isRequired]="!isEditing()" />
  <button
    type="button"
    data-testid="generate-password"
    class="flex items-center gap-1 rounded text-[12px]/[14px] font-medium text-primary hover:underline focus-visible:outline-2 focus-visible:outline-primary"
    (click)="generatePassword()"
  >
    <app-icon name="refresh" aria-hidden="true" [size]="14" />
    إنشاء كلمة مرور
  </button>
</div>
<!-- The input reads left to right from the right edge; the eye sits on its left end. -->
<div class="relative">
  <input
    id="owner-password"
    class="pl-11"
    [type]="isPasswordVisible() ? 'text' : 'password'"
    [formControl]="control()"
    [attr.placeholder]="placeholder()"
    autocomplete="new-password"
    appPlaceFieldControl
    fieldTone="strong"
    [isLatin]="true"
    latinEdge="right"
  />
  <button
    appPasswordVisibilityToggle
    class="absolute top-1/2 left-4 flex -translate-y-1/2 rounded text-text-secondary hover:text-text-primary focus-visible:outline-2 focus-visible:outline-primary"
    [(isVisible)]="isPasswordVisible"
    [iconSize]="eyeIconSize"
  ></button>
</div>
