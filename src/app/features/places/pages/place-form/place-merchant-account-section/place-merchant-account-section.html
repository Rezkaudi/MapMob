<app-form-section heading="معلومات حساب التاجر" icon="info" appearance="compact">
  <!-- RTL: email on the right, phone on its left, password under the email. The frame keeps the grid 219px tall. -->
  <div class="grid min-h-[171px] grid-cols-2 content-start gap-6" [formGroup]="form()">
    <div class="flex flex-col gap-1">
      <app-field-label text="البريد الالكتروني" forId="owner-email" [isRequired]="true" />
      <input
        id="owner-email"
        type="email"
        formControlName="ownerEmail"
        placeholder="example@gmail.com"
        autocomplete="off"
        appPlaceFieldControl
        fieldTone="strong"
        [isLatin]="true"
        latinEdge="right"
      />
    </div>
    <div class="flex flex-col gap-1">
      <app-field-label text="رقم هاتف المالك /المسؤول" forId="owner-phone" [isRequired]="true" />
      <input
        id="owner-phone"
        type="tel"
        formControlName="ownerPhone"
        appPlaceFieldControl
        fieldTone="strong"
        [isLatin]="true"
      />
    </div>
    <app-place-owner-password-field
      [control]="form().controls.ownerPassword"
      [isEditing]="isEditing()"
    />
  </div>
</app-form-section>
