<app-form-page-heading
  parentLabel="الشركات و المتاجر"
  parentLink="/admin/places"
  description="أضف مكان جديد ليظهر ضمن الأماكن المتاحة."
  [title]="heading()"
/>

@if (store.error(); as error) {
  <app-error-state class="mt-6 block" [message]="error" (retry)="store.retry()" />
} @else if (!store.isReady()) {
  <app-skeleton class="mt-6 block" height="640px" />
} @else {
  <!-- The frame's form area starts 23px under the description and pads its cards 24px more. -->
  <form [formGroup]="form" (ngSubmit)="save()" class="mt-[47px] flex flex-col gap-6">
    <app-place-basic-info-section id="basic-info" [form]="form" [categories]="categories()" />
    <app-place-location-section
      id="location"
      [form]="form"
      [cities]="cities()"
      [regions]="regions()"
    />
    <app-place-details-section id="details" [form]="form" />
    <app-place-delivery-section
      id="delivery"
      [platforms]="deliveryPlatforms()"
      [links]="form.controls.deliveryLinks"
    />

    <app-form-section
      id="working-hours"
      heading="أوقات العمل"
      icon="time-circle"
      appearance="compact"
      [iconSize]="20"
    >
      <button
        headerAction
        type="button"
        class="text-[14px]/[20px] font-bold text-primary hover:underline"
        (click)="openAllDay()"
      >
        مفتوح 24 ساعة
      </button>
      <app-working-hours-editor [week]="week()" (weekChange)="week.set($event)" />
    </app-form-section>

    <app-place-subscription-section id="subscription" [form]="form" />
    <app-place-media-section
      id="media"
      [images]="images()"
      [videos]="videos()"
      [limit]="mediaLimit()"
      [packageLabel]="packageLabel()"
      (imagesChange)="images.set($event)"
      (videosChange)="videos.set($event)"
    />
    <app-products-editor
      id="products"
      [products]="products()"
      [limit]="productLimit()"
      [packageLabel]="packageLabel()"
      (addProduct)="composeProduct()"
      (editProduct)="editProduct($event)"
      (removeProduct)="askToRemoveProduct($event)"
    />

    <app-place-form-actions />
  </form>
}

@if (hasSaved()) {
  <app-toast
    title="تم حفظ المكان بنجاح"
    message="تمت إضافة المكان بنجاح وسيظهر في قائمة الشركات والمتاجر."
    (dismissed)="dismissSavedToast()"
  />
}

@if (isAddingProduct()) {
  <app-product-dialog
    [mode]="productDialogMode()"
    [initialDraft]="editedProductDraft()"
    (submitted)="saveProduct($event)"
    (cancelled)="closeProductDialog()"
  />
}

@if (productToRemove()) {
  <app-confirm-dialog
    [title]="removeProductCopy().title"
    [message]="removeProductCopy().message"
    [warning]="removeProductCopy().warning"
    [confirmLabel]="removeProductCopy().confirmLabel"
    tone="danger"
    (confirmed)="confirmRemoveProduct()"
    (cancelled)="cancelRemoveProduct()"
  />
}
