<span
  class="flex shrink-0 items-center justify-center overflow-clip rounded-lg bg-[#0f7b4f]"
  [style.width]="sizeInPixels"
  [style.height]="sizeInPixels"
>
  @if (imageUrl()) {
    <img [src]="imageUrl()" [alt]="name()" class="size-full object-cover" />
  } @else {
    <span class="text-sm font-bold text-white">{{ initial() }}</span>
  }
</span>
