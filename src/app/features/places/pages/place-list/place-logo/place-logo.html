<span
  class="flex shrink-0 items-center justify-center overflow-clip rounded-lg bg-[#0f7b4f]"
  [style.width]="sizeInPixels"
  [style.height]="sizeInPixels"
>
  @if (imageUrl()) {
    <app-lazy-image
      [src]="imageUrl()"
      [alt]="name()"
      imageClass="size-full object-cover"
      class="size-full"
    >
      <span class="flex size-full items-center justify-center text-sm font-bold text-white">
        {{ initial() }}
      </span>
    </app-lazy-image>
  } @else {
    <span class="text-sm font-bold text-white">{{ initial() }}</span>
  }
</span>
