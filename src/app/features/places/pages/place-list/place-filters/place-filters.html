<!--
  RTL row: sort, category and package stay 200px wide as in the design; the search
  keeps its 390px minimum and takes any width left over. The chips sit 24px below,
  starting from the right.
-->
<div class="flex flex-col gap-6 rounded-xl border border-border bg-surface p-4">
  <div class="flex items-center gap-2">
    <div class="relative h-10 min-w-[390px] flex-1">
      <input
        type="search"
        class="h-10 w-full rounded-lg border border-text-secondary py-3 pr-[41px] pl-[17px] text-right text-[14px] text-text-primary outline-none placeholder:text-text-primary"
        placeholder="ابحث عن مكان أو مدينة..."
        (input)="onSearchInput($event)"
      />
      <app-icon
        name="search"
        [size]="16"
        class="absolute start-[17px] top-1/2 -translate-y-1/2 text-text-primary"
      />
    </div>

    <div class="relative h-10 w-[200px] shrink-0">
      <select
        class="h-10 w-full appearance-none rounded-lg border border-text-secondary bg-transparent pr-[13px] pl-9 text-right text-[14px] text-text-primary outline-none"
        aria-label="ترتيب حسب"
        (change)="sortChange.emit($any($event.target).value || null)"
      >
        <option value="">ترتيب حسب</option>
        @for (sort of sorts(); track sort.value) {
          <option [value]="sort.value">{{ sort.label }}</option>
        }
      </select>
      <app-icon
        name="sort"
        [size]="14"
        class="pointer-events-none absolute end-[13px] top-1/2 -translate-y-1/2 text-text-primary"
      />
    </div>

    <app-select-field
      class="w-[200px] shrink-0"
      placeholder="التصنيف"
      [options]="categories()"
      (valueChange)="categoryChange.emit($event)"
    />

    <app-select-field
      class="w-[200px] shrink-0"
      placeholder="الباقة"
      [options]="packages()"
      (valueChange)="packageChange.emit($event)"
    />
  </div>

  <app-filter-chips
    [options]="statusChips()"
    [selected]="selectedStatus()"
    (selectedChange)="statusChange.emit($event)"
  />
</div>
