<app-form-page-heading
  parentLabel="الألعاب"
  [parentLink]="gamesUrl"
  [title]="copy().title"
  [description]="copy().description"
/>

@if (store.error(); as error) {
  <app-error-state class="mt-12" [message]="error" (retry)="store.retry()" />
} @else if (!store.isReady()) {
  <app-skeleton class="mt-12 block" height="640px" />
} @else {
  <!-- The cards start 47px under the heading and sit 24px apart. -->
  <form class="mt-12 flex flex-col gap-6" novalidate [formGroup]="form" (ngSubmit)="publish()">
    <app-form-section heading="المعلومات العامة للعبة" appearance="compact">
      <!-- Two 471px columns 24px apart; RTL fills the right column first. -->
      <div class="grid gap-x-6 gap-y-6 sm:grid-cols-2">
        <app-form-field
          label="اسم اللعبة"
          forId="game-name"
          [isRequired]="true"
          [error]="errors.name"
        >
          <input
            id="game-name"
            type="text"
            formControlName="name"
            placeholder="مثال: الأغلبية الرابحة"
            [class]="controlClasses.text"
            [attr.aria-invalid]="errors.name !== null"
          />
        </app-form-field>
        <span class="hidden sm:block" aria-hidden="true"></span>

        <app-form-field class="sm:col-span-2" label="الوصف" forId="game-description">
          <input
            id="game-description"
            type="text"
            formControlName="description"
            placeholder="صوت مع الاغلبية واربح جوائز"
            [class]="controlClasses.text"
          />
        </app-form-field>

        <app-form-field
          label="تاريخ الجلسة"
          forId="game-starts-on"
          [isRequired]="true"
          [error]="errors.startsOn"
        >
          <div class="relative">
            <input
              id="game-starts-on"
              type="date"
              formControlName="startsOn"
              dir="ltr"
              [class]="pickerClasses"
              [attr.aria-invalid]="errors.startsOn !== null"
              (click)="openPicker($event)"
            />
            <app-icon
              name="calendar"
              [size]="16"
              class="pointer-events-none absolute start-4 top-1/2 -translate-y-1/2 text-text-primary"
              aria-hidden="true"
            />
          </div>
        </app-form-field>

        <app-form-field
          label="وقت انطلاق جلسة اللعب"
          forId="game-start-time"
          [isRequired]="true"
          [error]="errors.startTime"
        >
          <div class="relative">
            <input
              id="game-start-time"
              type="time"
              formControlName="startTime"
              dir="ltr"
              [class]="pickerClasses"
              [attr.aria-invalid]="errors.startTime !== null"
              (click)="openPicker($event)"
            />
            <app-icon
              name="clock"
              [size]="16"
              class="pointer-events-none absolute start-4 top-1/2 -translate-y-1/2 text-text-primary"
              aria-hidden="true"
            />
          </div>
        </app-form-field>

        <app-form-field label="المنطقة الزمنية" forId="game-time-zone" [isRequired]="true">
          <div class="relative">
            <select
              id="game-time-zone"
              formControlName="timeZone"
              class="ps-[49px] text-[16px]/[24px] text-[#1e293b]"
              [class]="controlClasses.select"
            >
              @for (option of timeZoneOptions; track option.value) {
                <option [value]="option.value">{{ option.label }}</option>
              }
            </select>
            <app-icon
              name="globe"
              [size]="17"
              class="pointer-events-none absolute start-4 top-1/2 -translate-y-1/2 text-[#1e293b]"
              aria-hidden="true"
            />
            <app-icon
              name="chevron-down-filled"
              [size]="12"
              class="pointer-events-none absolute end-4 top-1/2 -translate-y-1/2 text-[#717784]"
              aria-hidden="true"
            />
          </div>
        </app-form-field>

        <app-form-field
          label="مهلة التصويت لكل سؤال"
          forId="game-vote-seconds"
          [isRequired]="true"
          [error]="errors.voteSeconds"
        >
          <!-- RTL: the clock and number on the right, "ثوان" at the left end. -->
          <div class="relative">
            <input
              id="game-vote-seconds"
              type="number"
              min="1"
              inputmode="numeric"
              formControlName="voteSeconds"
              class="ps-12 pe-14"
              [class]="controlClasses.text"
              [attr.aria-invalid]="errors.voteSeconds !== null"
            />
            <app-icon
              name="clock"
              [size]="16"
              class="pointer-events-none absolute start-4 top-1/2 -translate-y-1/2 text-text-primary"
              aria-hidden="true"
            />
            <span
              class="pointer-events-none absolute end-[21px] top-1/2 -translate-y-1/2 text-[14px]/[17px] text-[#94a3b8]"
              >ثوان</span
            >
          </div>
        </app-form-field>
      </div>
    </app-form-section>

    <section
      aria-labelledby="game-questions-heading"
      class="rounded-xl border border-border bg-surface shadow-[0_1px_2px_0_rgba(0,0,0,0.05)]"
    >
      <!-- RTL: the amber heading on the right, "إضافة سؤال" on the left. -->
      <header class="flex items-center justify-between border-b border-[#f1f5f9] px-6 py-4">
        <h2 id="game-questions-heading" class="text-[14px]/[20px] font-bold text-accent">
          الأسئلة والجولات
        </h2>
        <button
          type="button"
          data-role="add-question"
          class="flex h-7 items-center gap-1 rounded bg-primary px-3 text-[12px]/[16px] font-medium text-white shadow-[0_1px_2px_0_rgba(0,0,0,0.05)] hover:bg-primary-hover"
          (click)="addQuestion()"
        >
          <app-icon name="plus" [size]="16" aria-hidden="true" />
          إضافة سؤال
        </button>
      </header>
      <div class="flex flex-col gap-6 p-6">
        @for (question of form.controls.questions.controls; track question; let index = $index) {
          <app-game-question-fields
            [group]="question"
            [index]="index"
            [errors]="errors.questions[index]"
            [canRemove]="form.controls.questions.length > 1"
            (remove)="removeQuestion(index)"
          />
        }
      </div>
    </section>

    <app-form-section heading="إعدادات الجائزة المرصودة" appearance="compact">
      <div class="grid gap-x-6 gap-y-6 sm:grid-cols-2">
        <app-form-field label="نوع الجائزة" forId="game-prize-kind" [isRequired]="true">
          <div class="relative">
            <select
              id="game-prize-kind"
              formControlName="prizeKind"
              class="ps-[49px] text-[16px]/[24px] text-[#1e293b]"
              [class]="controlClasses.select"
            >
              @for (option of prizeKindOptions; track option.value) {
                <option [value]="option.value">{{ option.label }}</option>
              }
            </select>
            <app-icon
              name="globe"
              [size]="17"
              class="pointer-events-none absolute start-4 top-1/2 -translate-y-1/2 text-[#1e293b]"
              aria-hidden="true"
            />
            <app-icon
              name="chevron-down-filled"
              [size]="12"
              class="pointer-events-none absolute end-4 top-1/2 -translate-y-1/2 text-[#717784]"
              aria-hidden="true"
            />
          </div>
        </app-form-field>

        <app-form-field label="العملة الرسمية" forId="game-currency" [isRequired]="true">
          <div class="relative">
            <select
              id="game-currency"
              formControlName="currency"
              class="ps-[49px] text-[16px]/[24px] text-[#1e293b]"
              [class]="controlClasses.select"
            >
              @for (option of currencyOptions; track option.value) {
                <option [value]="option.value">{{ option.label }}</option>
              }
            </select>
            <app-icon
              name="globe"
              [size]="17"
              class="pointer-events-none absolute start-4 top-1/2 -translate-y-1/2 text-[#1e293b]"
              aria-hidden="true"
            />
            <app-icon
              name="chevron-down-filled"
              [size]="12"
              class="pointer-events-none absolute end-4 top-1/2 -translate-y-1/2 text-[#717784]"
              aria-hidden="true"
            />
          </div>
        </app-form-field>

        <app-form-field
          label="قيمة الجائزة"
          forId="game-prize-amount"
          [isRequired]="true"
          [error]="errors.prizeAmount"
        >
          <input
            id="game-prize-amount"
            type="number"
            min="1"
            inputmode="numeric"
            formControlName="prizeAmount"
            class="text-[16px]/[24px] text-[#1e293b]"
            [class]="controlClasses.text"
            [attr.aria-invalid]="errors.prizeAmount !== null"
          />
        </app-form-field>

        <app-form-field
          label="العدد الأقصى للفائزين"
          forId="game-max-winners"
          [isRequired]="true"
          [error]="errors.maxWinnerCount"
        >
          <input
            id="game-max-winners"
            type="number"
            min="1"
            inputmode="numeric"
            formControlName="maxWinnerCount"
            [class]="controlClasses.text"
            [attr.aria-invalid]="errors.maxWinnerCount !== null"
          />
        </app-form-field>

        @if (isVoucher) {
          <app-form-field
            label="الجهة المقدمة للجائزة"
            forId="game-sponsor"
            [isRequired]="true"
            [error]="errors.sponsorName"
          >
            <input
              id="game-sponsor"
              type="text"
              formControlName="sponsorName"
              placeholder="مثال: كافية النور"
              [class]="controlClasses.text"
              [attr.aria-invalid]="errors.sponsorName !== null"
            />
          </app-form-field>
        }
      </div>
    </app-form-section>

    <app-form-action-bar
      class="mt-[23px]"
      [saveLabel]="copy().saveLabel"
      [cancelLink]="gamesUrl"
      [isBusy]="store.isSaving()"
      (saveDraft)="saveDraft()"
    />
  </form>
}

@if (store.saveError(); as saveError) {
  <app-toast
    tone="error"
    title="تعذر حفظ اللعبة"
    [message]="saveError"
    (dismissed)="store.clearSaveError()"
  />
}
