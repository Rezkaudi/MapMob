<!-- Four 201px tiles 14px apart; RTL puts the participants on the right. Each tile: words right, icon left. -->
<ul class="grid grid-cols-2 gap-3.5 sm:grid-cols-4">
  <li
    class="flex items-center justify-between rounded-xl border border-[#f1f5f9] bg-surface-muted p-3.5"
  >
    <div class="flex flex-col items-start gap-[1.5px]">
      <span class="text-[12px]/[16px] text-text-secondary">إجمالي المشاركين</span>
      <span class="text-[18px]/[28px] font-extrabold text-text-primary">{{
        tiles().participants
      }}</span>
    </div>
    <app-icon name="users-curved" [size]="24" class="text-primary" aria-hidden="true" />
  </li>
  <li
    class="flex items-center justify-between rounded-xl border border-[#f1f5f9] bg-surface-muted p-3.5"
  >
    <div class="flex flex-col items-start gap-[1.5px]">
      <span class="text-[12px]/[16px] text-text-secondary">عدد الفائزين</span>
      <span class="text-[18px]/[28px] font-extrabold text-text-primary">{{ tiles().winners }}</span>
    </div>
    <app-icon name="users-curved" [size]="24" class="text-primary" aria-hidden="true" />
  </li>
  <li
    class="flex items-center justify-between rounded-xl border border-[#f1f5f9] bg-surface-muted p-3.5"
  >
    <div class="flex flex-col items-start gap-[1.5px]">
      <span class="text-[12px]/[16px] text-text-secondary">إجمالي الجوائز</span>
      <span class="flex items-baseline gap-1">
        <span class="text-[18px]/[28px] font-extrabold text-[#1e293b]">{{
          tiles().prizeAmount
        }}</span>
        <span class="text-[12px]/[16px] text-text-secondary">{{ tiles().prizeCurrency }}</span>
      </span>
    </div>
    <app-icon name="trophy" [size]="24" class="text-accent" aria-hidden="true" />
  </li>
  <li
    class="flex items-center justify-between rounded-xl border border-[#f1f5f9] bg-surface-muted p-3.5"
  >
    <div class="flex flex-col items-start gap-[1.5px]">
      <span class="text-[12px]/[16px] text-text-secondary">الجوائز المسلّمة</span>
      <!-- "/4" in an RTL line reads as "4/" left of the count, as the frame writes it. -->
      <span class="flex items-baseline gap-1.5">
        <span class="text-[18px]/[28px] font-extrabold text-accent">{{ tiles().delivered }}</span>
        <span class="text-[12px]/[16px] text-text-secondary">{{ tiles().deliveredOutOf }}</span>
      </span>
    </div>
    <app-icon name="trophy" [size]="24" class="text-accent" aria-hidden="true" />
  </li>
</ul>
