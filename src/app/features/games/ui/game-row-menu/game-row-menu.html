<app-action-menu menuStyle="sharp" label="خيارات اللعبة">
  <!-- RTL: each item leads with its icon on the right, in a 17px slot so the labels line up. -->
  <button
    type="button"
    class="flex w-full items-center gap-3 rounded-[2px] px-3 py-2 text-[14px]/[20px] text-text-primary hover:bg-surface-muted"
    (click)="view.emit()"
  >
    <span class="flex w-[17px] justify-center"
      ><app-icon name="eye-filled" [size]="17" aria-hidden="true"
    /></span>
    <span>عرض التفاصيل</span>
  </button>
  @if (canChange()) {
    <button
      type="button"
      class="flex w-full items-center gap-3 rounded-[2px] px-3 py-2 text-[14px]/[20px] text-text-primary hover:bg-surface-muted"
      (click)="edit.emit()"
    >
      <span class="flex w-[17px] justify-center"
        ><app-icon name="edit-filled" [size]="14" aria-hidden="true"
      /></span>
      <span>تعديل</span>
    </button>
    <span data-role="menu-divider" class="block h-px bg-border"></span>
    <button
      type="button"
      class="flex w-full items-center gap-3 rounded-[2px] px-3 pt-3 pb-2 text-[14px]/[20px] text-text-primary hover:bg-surface-muted"
      (click)="remove.emit()"
    >
      <span class="flex w-[17px] justify-center"
        ><app-icon name="trash-filled" [size]="14" class="text-closed" aria-hidden="true"
      /></span>
      <span>حذف اللعبة</span>
    </button>
  }
</app-action-menu>
