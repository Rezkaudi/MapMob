<!-- Four 185px columns 24px apart; RTL puts the name in the right-hand column. -->
<dl
  class="grid grid-cols-2 gap-x-6 gap-y-3.5 rounded-xl border border-border bg-surface-muted p-4 sm:grid-cols-4"
>
  <div class="flex flex-col gap-0.5">
    <dt class="text-[12px]/[16px] text-text-secondary">اسم اللعبة والجولة:</dt>
    <dd data-role="title" class="text-[14px]/[20px] font-bold text-text-primary">
      {{ view().title }}
    </dd>
  </div>
  <div class="flex flex-col gap-[1.5px]">
    <dt class="text-[12px]/[16px] text-text-secondary">تاريخ البدء:</dt>
    <dd class="text-[12px]/[16px] font-medium text-text-primary">{{ view().dayText }}</dd>
  </div>
  <div class="flex flex-col gap-[1.5px]">
    <dt class="text-[12px]/[16px] text-text-secondary">وقت البدء:</dt>
    <dd class="text-[12px]/[16px] font-medium text-text-primary">{{ view().clockText }}</dd>
  </div>
  <div class="flex flex-col items-start gap-[1.5px]">
    <dt class="text-[12px]/[16px] text-text-secondary">حالة اللعبة:</dt>
    <dd
      data-role="status-pill"
      class="rounded-full px-3 text-[12px]/[20px] text-white"
      [class]="view().pillClass"
    >
      {{ view().statusLabel }}
    </dd>
  </div>
  <div class="flex flex-col gap-[1.5px]">
    <dt class="text-[12px]/[16px] text-text-secondary">عدد الأسئلة:</dt>
    <dd class="text-[12px]/[16px] font-medium text-text-primary">{{ view().questionCountText }}</dd>
  </div>
  <div class="flex flex-col gap-[1.5px]">
    <dt class="text-[12px]/[16px] text-text-secondary">نوع الجائزة:</dt>
    <dd class="text-[12px]/[16px] font-medium text-text-primary">{{ view().prizeKindLabel }}</dd>
  </div>
  <div class="flex flex-col gap-0.5">
    <dt class="text-[12px]/[16px] text-text-secondary">{{ view().highlight.label }}</dt>
    <dd data-role="highlight" class="text-[14px]/[20px] font-bold text-primary">
      {{ view().highlight.value }}
    </dd>
  </div>
</dl>
