<app-action-menu menuStyle="sharp" label="خيارات الفائز">
  <button
    type="button"
    class="flex w-full items-center gap-3 rounded-[2px] px-3 py-2 text-[14px]/[20px] text-text-primary hover:bg-surface-muted"
    (click)="view.emit()"
  >
    <span class="flex w-[17px] justify-center"
      ><app-icon name="eye-filled" [size]="17" aria-hidden="true"
    /></span>
    <span>عرض تفاصيل الفائز</span>
  </button>
  <button
    type="button"
    class="flex w-full items-center gap-3 rounded-[2px] px-3 pt-2 pb-3 text-[14px]/[20px] text-text-primary hover:bg-surface-muted"
    (click)="statusChange.emit()"
  >
    <span class="flex w-[17px] justify-center"
      ><app-icon name="change-status" [size]="12" aria-hidden="true"
    /></span>
    <span>تغيير الحالة</span>
  </button>
</app-action-menu>
