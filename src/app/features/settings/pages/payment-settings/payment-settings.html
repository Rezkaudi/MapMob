<app-settings-section-heading
  title="إعدادات الدفع"
  description="التحكم في بوابات الدفع الالكتروني والتحويل البنكي و رسوم الاشتراكات."
>
  <app-settings-add-button
    sectionHeadingAction
    class="me-[3px]"
    label="إضافة بوابة دفع"
    (pressed)="store.openAddDialog()"
  />
</app-settings-section-heading>

@if (store.error(); as error) {
  <app-error-state [message]="error" (retry)="store.loadMethods()" />
} @else {
  <app-payment-method-table
    [methods]="store.methods()"
    [isLoading]="store.isLoading()"
    (edit)="store.openEditDialog($event)"
  />
}

@if (store.dialog(); as dialog) {
  <app-payment-method-dialog
    [dialog]="dialog"
    [isBusy]="store.isSaving()"
    [saveError]="store.saveError()"
    (saved)="store.saveMethod($event)"
    (closed)="store.closeDialog()"
  />
}

@if (savedTitle(); as title) {
  <app-toast
    [title]="title"
    message="تظهر وسيلة الدفع بحالتها الجديدة للتجار عند الدفع."
    (dismissed)="store.dismissSavedNotice()"
  />
}
