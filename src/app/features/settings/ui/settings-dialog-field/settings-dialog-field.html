<div class="flex flex-col gap-1.5">
  <!-- RTL: the label text on the right, the star after it. -->
  <label class="flex h-5 items-center gap-1 text-start" [for]="fieldId()">
    <span class="text-[12px]/[16px] font-bold text-text-primary">{{ label() }}</span>
    @if (isRequired()) {
      <span
        data-role="required-star"
        class="text-[14px]/[20px] font-bold text-status-error"
        aria-hidden="true"
        >*</span
      >
    }
  </label>
  <div class="relative">
    <ng-content />
    @if (hasChevron()) {
      <app-icon
        name="chevron-down"
        class="pointer-events-none absolute top-[11px] left-[17px] text-text-primary"
        aria-hidden="true"
        [size]="16"
      />
    }
  </div>
  @if (error(); as error) {
    <p role="alert" class="text-start text-[12px]/[16px] text-closed">{{ error }}</p>
  }
</div>
