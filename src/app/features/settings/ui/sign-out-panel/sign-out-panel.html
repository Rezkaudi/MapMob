<!-- RTL: the icon and text on the right, the button on the left. -->
<div class="flex items-center justify-between gap-4 rounded-lg bg-closed/16 p-4">
  <div class="flex items-center gap-3">
    <span class="flex size-9 shrink-0 items-center justify-center rounded bg-white text-closed">
      <app-icon name="sign-out" [size]="20" aria-hidden="true" />
    </span>
    <div class="flex flex-col text-start">
      <p class="text-[12px]/[16px] font-medium text-[#191c1e]">تسجيل الخروج من الجلسة الحالية</p>
      <p class="text-[12px]/[18px] text-text-secondary">
        سيتم إنهاء الجلسة والعودة لشاشة الدخول الرئيسية للمشرفين.
      </p>
    </div>
  </div>
  <button
    type="button"
    class="h-8 shrink-0 rounded bg-white px-4 text-[12px]/[16px] text-closed hover:bg-closed/5 focus-visible:outline-2 focus-visible:outline-closed"
    (click)="signOut.emit()"
  >
    تسجيل الخروج
  </button>
</div>
