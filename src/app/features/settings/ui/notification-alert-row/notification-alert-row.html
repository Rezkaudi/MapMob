<!-- RTL: the icon and text on the right, the switch on the left. -->
<div class="flex h-15 items-center justify-between gap-4 rounded p-3">
  <div class="flex items-center gap-3">
    <span
      data-role="alert-icon"
      class="flex size-9 shrink-0 items-center justify-center rounded"
      [class]="copy().toneClasses"
    >
      <app-icon [name]="copy().icon" [size]="16" aria-hidden="true" />
    </span>
    <div class="flex flex-col gap-0.5 text-start">
      <p data-role="alert-title" class="text-[12px]/[16px] font-medium text-text-primary">
        {{ copy().title }}
      </p>
      <p data-role="alert-description" class="text-[12px]/[18px] text-text-secondary">
        {{ copy().description }}
      </p>
    </div>
  </div>
  <app-toggle-switch
    [isOn]="alert().isEnabled"
    [label]="copy().title"
    (toggled)="toggled.emit($event)"
  />
</div>
