<form novalidate [formGroup]="form" (ngSubmit)="submit()">
  <app-settings-card title="إعدادات العملة و الأسعار">
    <!-- RTL order, right to left: currency, symbol, decimal places. -->
    <div class="grid grid-cols-3 items-start gap-4">
      <app-settings-field
        label="العملة الافتراضية"
        fieldId="default-currency"
        icon="chevron-left-thin"
        iconPlacement="chevron"
      >
        <select id="default-currency" formControlName="currency" [class]="selectClasses">
          @for (choice of currencyChoices; track choice.value) {
            <option [ngValue]="choice.value">{{ choice.label }}</option>
          }
        </select>
      </app-settings-field>

      <app-settings-field
        label="رمز العملة المعروض"
        fieldId="currency-symbol"
        [error]="symbolError"
      >
        <input
          id="currency-symbol"
          type="text"
          formControlName="currencySymbol"
          [class]="inputClasses"
          [attr.aria-invalid]="symbolError !== null"
        />
      </app-settings-field>

      <app-settings-field
        label="المنازل العشرية"
        fieldId="decimal-places"
        icon="chevron-left-thin"
        iconPlacement="chevron"
      >
        <select id="decimal-places" formControlName="decimalPlaces" [class]="selectClasses">
          @for (choice of decimalChoices; track choice.value) {
            <option [ngValue]="choice.value">{{ choice.label }}</option>
          }
        </select>
      </app-settings-field>
    </div>

    <div class="flex justify-end pt-1">
      <button
        type="submit"
        [class]="submitButtonClasses"
        [disabled]="isSaving()"
        [attr.aria-busy]="isSaving()"
      >
        حفظ التغييرات
      </button>
    </div>
  </app-settings-card>
</form>
