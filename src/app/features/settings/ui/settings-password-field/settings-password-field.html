<app-settings-field [label]="label()" [fieldId]="fieldId()" [error]="error()">
  <input
    dir="ltr"
    [id]="fieldId()"
    [type]="isPasswordVisible() ? 'text' : 'password'"
    [formControl]="control()"
    [placeholder]="placeholder"
    [attr.autocomplete]="autocomplete()"
    [class]="inputClasses"
    [attr.aria-invalid]="error() !== null"
  />
  <button
    appPasswordVisibilityToggle
    class="absolute top-2.5 left-3 flex rounded text-text-secondary hover:text-text-primary focus-visible:outline-2 focus-visible:outline-primary"
    [(isVisible)]="isPasswordVisible"
  ></button>
</app-settings-field>
