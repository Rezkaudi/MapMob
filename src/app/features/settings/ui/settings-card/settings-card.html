<section
  class="flex flex-col rounded-lg bg-white p-6 shadow-[0_1px_2px_0_rgba(0,0,0,0.05)]"
  [class]="spacingClasses()"
>
  <!-- RTL: the title on the right, the badge on the left. -->
  <header class="flex items-center justify-between border-b border-[#eceef0] pb-4">
    <h3 class="text-start text-[12px]/[16px] font-bold text-text-primary">{{ title() }}</h3>
    <ng-content select="[settingsCardBadge]" />
  </header>
  <div class="flex flex-col" [class]="spacingClasses()">
    <ng-content />
  </div>
</section>
