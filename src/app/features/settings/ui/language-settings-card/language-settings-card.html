<form novalidate [formGroup]="form" (ngSubmit)="submit()">
  <app-settings-card title="إعدادات اللغة">
    <div class="grid grid-cols-2 items-start gap-4 pt-1">
      <app-settings-field
        label="اللغة الافتراضية للمنصة والتطبيق"
        fieldId="default-language"
        icon="chevron-left-thin"
        iconPlacement="chevron"
      >
        <select id="default-language" formControlName="defaultLanguage" [class]="selectClasses">
          @for (choice of languageChoices; track choice.value) {
            <option [ngValue]="choice.value">{{ choice.label }}</option>
          }
        </select>
      </app-settings-field>

      <!-- RTL: the box on the right, its text beside it; a ticked box draws the blue frame. -->
      <label
        for="detect-device-language"
        class="flex h-14 cursor-pointer items-center gap-[11px] rounded border-2 border-transparent bg-[#f2f4f6] ps-[11px] pe-[66px] has-checked:border-primary has-focus-visible:ring-2 has-focus-visible:ring-primary/40"
      >
        <span class="flex w-12 shrink-0 justify-center">
          <input
            id="detect-device-language"
            type="checkbox"
            formControlName="detectsDeviceLanguage"
            class="size-[18px] cursor-pointer accent-primary"
          />
        </span>
        <span class="flex flex-col gap-[5.5px] pb-[3.5px] text-start">
          <span class="text-[12px]/[16px] font-bold text-text-primary">
            الكشف التلقائي عن لغة جهاز المستخدم
          </span>
          <span class="text-[10px]/[15px] text-text-secondary">
            تطبيق اللغة تلقائياً حسب إعدادات جهاز المستخدم.
          </span>
        </span>
      </label>
    </div>

    <div class="flex justify-end pt-1">
      <button
        type="submit"
        [class]="submitButtonClasses"
        [disabled]="isSaving()"
        [attr.aria-busy]="isSaving()"
      >
        حفظ التغييرات
      </button>
    </div>
  </app-settings-card>
</form>
