<article
  class="flex h-full min-h-[206px] flex-col justify-between rounded-lg border border-[rgba(192,199,213,0.2)] bg-white p-6 shadow-[0_1px_2px_0_rgba(0,0,0,0.05)]"
>
  <div class="flex flex-col gap-3">
    <!-- RTL: the tile on the right, then the Arabic name, then the English one. -->
    <div class="flex items-center gap-3">
      <span
        data-role="role-icon"
        class="flex h-10 w-[39.44px] shrink-0 items-center justify-center rounded-lg"
        [class]="skin().tileClasses"
      >
        <app-icon [name]="skin().icon" [size]="20" aria-hidden="true" />
      </span>
      <div class="flex items-center gap-1 pb-px">
        <h3 class="text-[18px]/[28px] font-medium text-text-primary">{{ role().name }}</h3>
        @if (role().englishName) {
          <span data-role="english-name" class="text-[12px]/[14px] text-text-secondary">
            ({{ role().englishName }})
          </span>
        }
      </div>
    </div>

    <p
      data-role="role-description"
      class="text-start text-[12px]/[18px] whitespace-nowrap text-text-secondary"
    >
      {{ role().description }}
    </p>

    <div class="flex h-[26px] items-center gap-4 text-[13px]/[18px] text-text-secondary">
      <span data-role="admin-count">{{ adminCountLabel() }}</span>
      <span class="h-3 w-px bg-[rgba(192,199,213,0.6)]" aria-hidden="true"></span>
      <span class="flex items-center gap-1">
        <app-icon
          class="text-status-success"
          name="check-circle-small"
          [size]="14"
          aria-hidden="true"
        />
        <span data-role="permission-count">{{ permissionCountLabel() }}</span>
      </span>
    </div>
  </div>

  <!-- RTL: edit or view on the right, delete on the left; each icon sits right of its word. -->
  <div class="flex items-center justify-center gap-1 pt-4">
    <button
      type="button"
      class="flex h-8 items-center gap-1 rounded px-4 text-[12px]/[16px] text-primary hover:bg-primary-tint focus-visible:outline-2 focus-visible:outline-primary"
      (click)="open.emit(role())"
    >
      @if (role().isFullAccess) {
        <app-icon name="eye-small" [size]="15" aria-hidden="true" />
        عرض الصلاحيات
      } @else {
        <app-icon name="pencil-small" [size]="12" aria-hidden="true" />
        تعديل
      }
    </button>
    <button
      type="button"
      class="flex h-8 items-center gap-1 rounded px-4 text-[12px]/[16px] text-closed opacity-80 hover:bg-closed/10 hover:opacity-100 focus-visible:outline-2 focus-visible:outline-closed"
      (click)="remove.emit(role())"
    >
      <app-icon name="trash-small" [size]="12" aria-hidden="true" />
      حذف
    </button>
  </div>
</article>
