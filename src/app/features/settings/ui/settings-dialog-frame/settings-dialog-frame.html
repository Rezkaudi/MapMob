<div class="fixed inset-0 z-50 overflow-y-auto bg-[rgba(25,28,29,0.3)] backdrop-blur-[4px]">
  <div
    class="flex min-h-full items-center justify-center p-6"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="titleId"
    (click)="closed.emit()"
  >
    <div
      class="w-full max-w-[580px] overflow-hidden rounded-3xl border border-[#f1f5f9] bg-white shadow-[0_25px_50px_-12px_rgba(0,0,0,0.25)]"
      (click)="$event.stopPropagation()"
    >
      <!-- RTL: the badge and title on the right, the cross on the left. -->
      <header
        class="flex items-start justify-between gap-4 border-b border-[#f1f5f9] px-6 pt-6 pb-4"
      >
        <div class="flex items-start gap-4">
          <span
            class="flex size-12 shrink-0 items-center justify-center rounded-2xl border border-[#dbeafe] bg-[#f0f7fe] text-primary shadow-[inset_0_2px_4px_1px_rgba(0,0,0,0.05)]"
          >
            <app-icon [name]="icon()" [size]="20" aria-hidden="true" />
          </span>
          <div class="flex flex-col gap-[3px] text-start">
            <h2
              class="text-[20px]/[28px] font-bold tracking-[-0.5px] text-text-primary"
              [id]="titleId"
            >
              {{ title() }}
            </h2>
            <p class="max-w-[365px] text-[12px]/[19.5px] text-text-secondary">
              {{ description() }}
            </p>
          </div>
        </div>
        <button
          type="button"
          aria-label="إغلاق النافذة"
          class="flex size-8 shrink-0 items-center justify-center rounded text-[#94a3b8] hover:bg-surface-muted"
          (click)="closed.emit()"
        >
          <app-icon name="dialog-close" [size]="32" aria-hidden="true" />
        </button>
      </header>

      <div class="flex flex-col gap-4 px-6 pt-5 pb-6">
        <ng-content />
        @if (saveError(); as error) {
          <p role="alert" class="text-start text-[12px]/[16px] text-closed">{{ error }}</p>
        }
      </div>

      <!-- RTL: the main action on the right, cancel on the left. -->
      <footer
        class="flex items-center justify-between border-t border-[#f1f5f9] bg-[rgba(248,250,252,0.7)] px-6 pt-4 pb-6"
      >
        <button
          type="submit"
          class="h-10 rounded-lg bg-primary px-6 text-[12px]/[16px] font-bold text-white hover:bg-primary-hover disabled:cursor-not-allowed disabled:opacity-60"
          [disabled]="isBusy()"
          [attr.aria-busy]="isBusy()"
        >
          {{ submitLabel() }}
        </button>
        <button
          type="button"
          class="h-10 rounded-lg border border-border bg-white px-5 text-[12px]/[16px] font-bold text-text-primary hover:bg-surface-muted"
          (click)="closed.emit()"
        >
          إلغاء
        </button>
      </footer>
    </div>
  </div>
</div>
