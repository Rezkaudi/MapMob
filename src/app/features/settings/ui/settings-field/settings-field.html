<div class="flex flex-col gap-1">
  <label class="text-start text-[12px]/[16px] font-medium text-text-primary" [for]="fieldId()">
    {{ label() }}
  </label>
  <div class="relative">
    <ng-content />
    @if (icon(); as icon) {
      <app-icon
        class="pointer-events-none absolute top-2.5 text-text-secondary"
        [class]="iconPlacementClasses()"
        aria-hidden="true"
        [name]="icon"
        [size]="16"
      />
    }
  </div>
  @if (error(); as error) {
    <p role="alert" class="text-start text-[12px]/[16px] text-closed">{{ error }}</p>
  }
</div>
