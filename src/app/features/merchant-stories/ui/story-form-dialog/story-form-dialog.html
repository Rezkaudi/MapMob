<app-form-dialog-frame
  [heading]="copy().heading"
  subheading="ستظهر للمستخدمين لمدة 24 ساعة فقط."
  (closed)="cancelled.emit()"
>
  @if (dialog().notice; as notice) {
    <!-- RTL: the blue info mark leads on the right, then the plan line. -->
    <p
      data-role="notice"
      class="flex min-h-11 items-center gap-2 rounded-lg bg-[#f2f4f6] px-[19px] py-3 text-[12px]/[15px] text-text-primary"
    >
      <app-icon name="info-circle-filled" [size]="17" class="text-primary" aria-hidden="true" />
      <span>{{ notice }}</span>
    </p>
  }

  <div class="flex flex-col gap-2">
    <app-field-label size="compact" text="صورة أو فيديو القصة" />
    @if (fileRow(); as file) {
      <!-- RTL: the preview leads on the right, the name follows, the action ends on the left. -->
      <div class="flex items-center gap-3 rounded-lg bg-[#f2f4f6] p-3" [attr.data-role]="file.role">
        @if (file.pictureUrl; as pictureUrl) {
          <img [src]="pictureUrl" [alt]="file.name" class="size-16 rounded-lg object-cover" />
        } @else {
          <span
            class="flex size-16 items-center justify-center rounded-lg bg-accent/16 text-accent"
          >
            <app-icon name="video" [size]="24" aria-hidden="true" />
          </span>
        }
        <span class="flex min-w-0 flex-1 flex-col text-start">
          <span class="truncate text-[13px]/[18px] text-text-primary">{{ file.name }}</span>
          @if (file.sizeText; as sizeText) {
            <span dir="ltr" class="text-end text-[11px]/[14px] text-text-secondary">{{
              sizeText
            }}</span>
          }
        </span>
        <button
          type="button"
          class="text-[13px] font-medium"
          [class]="file.actionColor"
          [attr.data-testid]="file.actionTestId"
          [disabled]="isBusy()"
          (click)="clearFile()"
        >
          {{ file.actionLabel }}
        </button>
      </div>
    } @else {
      <app-file-dropzone
        appearance="dashed"
        prompt="اسحب وأفلت الصورة أو الفيديو هنا"
        hint="صورة حتى 5 ميجابايت (JPG, PNG) أو فيديو حتى 50 ميجابايت"
        [accept]="accept"
        [isMultiple]="false"
        (filesPicked)="onFilesPicked($event)"
      />
    }
    @if (fileError(); as error) {
      <p role="alert" class="text-start text-[12px]/[16px] text-error">{{ error }}</p>
    }
  </div>

  <div class="flex flex-col gap-1.5">
    <!-- RTL: the label reads first on the right; the counter ends the row on the left. -->
    <div data-role="caption-label" class="flex items-start justify-between gap-2">
      <label [attr.for]="captionFieldId" class="text-[12px]/[16px] font-bold text-text-primary"
        >نص القصة (اختياري)</label
      >
      <span data-role="counter" class="text-[12px]/[16px] font-bold text-text-secondary">{{
        counter()
      }}</span>
    </div>
    <textarea
      class="h-[103px] resize-none rounded-xl border border-border bg-[#f8fafc] p-4 text-[14px]/[22.75px] text-text-primary placeholder:text-placeholder focus:border-primary focus:outline-none"
      placeholder="اكتب نصاً قصيراً و جذاباً للقصة يظهر للعملاء."
      [id]="captionFieldId"
      [attr.maxlength]="captionMaxLength"
      [value]="caption()"
      (input)="onCaptionInput($event)"
    ></textarea>
  </div>

  <!-- RTL: the blue action lands leftmost. -->
  <button
    formDialogFooter
    type="button"
    data-testid="cancel-story"
    class="h-11 rounded-lg border border-border bg-surface px-5 text-[12px]/[16px] text-text-primary hover:bg-surface-muted"
    (click)="cancelled.emit()"
  >
    إلغاء
  </button>
  <button
    formDialogFooter
    type="button"
    data-testid="submit-story"
    class="h-11 min-w-[137px] rounded-lg border border-primary bg-primary px-5 text-[14px]/[14px] font-bold tracking-[0.5px] text-[#f8fafc] hover:bg-primary-hover disabled:cursor-not-allowed disabled:opacity-50"
    [disabled]="!canSubmit()"
    [attr.aria-busy]="isBusy()"
    (click)="submit()"
  >
    {{ copy().submitLabel }}
  </button>
</app-form-dialog-frame>
