<app-filter-popover
  panelId="ad-filter-panel"
  heading="تصفية الإعلانات"
  [canApply]="canApply()"
  (applied)="apply()"
  (reset)="reset()"
  (closed)="closed.emit()"
>
  <div class="flex flex-col gap-1.5">
    <span class="text-[12px]/[16px] font-bold text-text-primary">الحالة</span>
    <app-choice-chips
      label="الحالة"
      layout="fill"
      [options]="statusOptions"
      [selected]="draft().status"
      (selectedChange)="pickStatus($event)"
    />
  </div>

  <div class="flex flex-col gap-1.5">
    <span class="text-[12px]/[16px] font-bold text-text-primary">نوع المحتوى</span>
    <app-choice-chips
      label="نوع المحتوى"
      [options]="contentTypeOptions"
      [selected]="draft().contentType"
      (selectedChange)="toggleContentType($event)"
    />
  </div>

  <div class="flex flex-col gap-1.5">
    <span class="text-[12px]/[16px] font-bold text-text-primary">المعلن</span>
    <app-choice-chips
      label="المعلن"
      [options]="advertiserTypeOptions"
      [selected]="draft().advertiserType"
      (selectedChange)="toggleAdvertiserType($event)"
    />
  </div>

  <label class="flex flex-col gap-[8.5px] pt-[5.5px]">
    <span class="text-[12px]/[16px] font-medium text-text-primary">مكان ظهور الإعلان</span>
    <!-- RTL: the page name on the right, the chevron 10px in from the left edge. -->
    <span class="relative block">
      <select
        aria-label="مكان ظهور الإعلان"
        class="block h-9 w-full appearance-none rounded border border-text-secondary bg-white ps-3 pe-8 text-[12px]/[16px] font-medium text-[#1e293b] outline-none focus:border-primary"
        (change)="pickPlacement($event)"
      >
        <option value="" [selected]="draft().placement === null">كل الصفحات</option>
        @for (option of placementOptions; track option.value) {
          <option [value]="option.value" [selected]="option.value === draft().placement">
            {{ option.label }}
          </option>
        }
      </select>
      <app-icon
        name="chevron-down-thin"
        [size]="16"
        class="pointer-events-none absolute top-1/2 left-2.5 -translate-y-1/2 text-[#94a3b8]"
      />
    </span>
  </label>

  <div class="flex flex-col gap-2.5 border-t border-[#f1f5f9] pt-3">
    <span class="text-[12px]/[16px] font-bold text-text-primary">تاريخ الإعلان</span>
    <app-date-range-fields
      [range]="draft().runningRange"
      [hasFixedWidthFields]="true"
      (rangeChange)="changeRange($event)"
    />
  </div>
</app-filter-popover>
