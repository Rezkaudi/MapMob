<!-- RTL: "تعديل الإعلان" leads on the right, then the pause toggle, then "حذف". -->
<div class="flex items-center gap-2" [attr.aria-busy]="isBusy()">
  <button
    type="button"
    class="flex h-10 w-[120px] items-center justify-center gap-1 rounded-lg bg-primary text-[12px]/[16px] font-bold text-white shadow-[0_1px_2px_0_rgba(0,0,0,0.05)] hover:bg-primary-hover disabled:cursor-not-allowed disabled:opacity-60"
    [disabled]="isBusy()"
    (click)="edit.emit()"
  >
    <app-icon name="edit-outline" [size]="14" aria-hidden="true" />
    <span>تعديل الإعلان</span>
  </button>

  @switch (pauseAction()) {
    @case ('pause') {
      <button
        type="button"
        class="flex h-[42px] w-[100px] items-center justify-center gap-1 rounded-lg border border-border bg-white text-[12px]/[16px] text-text-primary hover:bg-surface-muted disabled:cursor-not-allowed disabled:opacity-60"
        [disabled]="isBusy()"
        (click)="statusChange.emit()"
      >
        <app-icon name="pause-outline" [size]="14" aria-hidden="true" />
        <span>إيقاف الإعلان</span>
      </button>
    }
    @case ('resume') {
      <button
        type="button"
        class="flex h-[42px] w-[100px] items-center justify-center gap-1 rounded-lg border border-border bg-white text-[12px]/[16px] text-text-primary hover:bg-surface-muted disabled:cursor-not-allowed disabled:opacity-60"
        [disabled]="isBusy()"
        (click)="statusChange.emit()"
      >
        <app-icon name="play" [size]="14" aria-hidden="true" />
        <span>تفعيل الإعلان</span>
      </button>
    }
  }

  <button
    type="button"
    class="flex h-10 w-[100px] items-center justify-center gap-1 rounded-lg border border-closed text-[12px]/[16px] text-closed hover:bg-closed/5 disabled:cursor-not-allowed disabled:opacity-60"
    [disabled]="isBusy()"
    (click)="remove.emit()"
  >
    <app-icon name="trash-filled" [size]="14" aria-hidden="true" />
    <span>حذف</span>
  </button>
</div>
