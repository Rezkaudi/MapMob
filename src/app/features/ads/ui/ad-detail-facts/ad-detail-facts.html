<!-- RTL: each label on the right, its value on the left. -->
<dl class="flex flex-col gap-3 rounded-lg border border-[#eceef0] bg-[#f2f4f6] p-4">
  @for (fact of facts(); track fact.label) {
    <div class="flex items-start justify-between gap-3">
      <dt class="text-[12px]/[16px] text-text-secondary">{{ fact.label }}</dt>
      <dd class="text-start text-[13px]/[18px] font-bold text-text-primary">{{ fact.value }}</dd>
    </div>
  }
</dl>
