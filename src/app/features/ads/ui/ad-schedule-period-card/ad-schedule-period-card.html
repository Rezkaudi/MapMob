<!-- RTL: the first day on the right, the last on the left. -->
<div class="grid grid-cols-2 gap-4 text-start">
  <div class="flex flex-col gap-1.5 rounded-xl border border-border bg-[#fbfcfd] p-4">
    <span class="text-[12px]/[16px] font-medium text-text-secondary">تاريخ ووقت البداية</span>
    <span class="text-[14px]/[20px] font-bold text-text-primary">{{ view().startsOnLabel }}</span>
  </div>
  <div class="flex flex-col gap-1.5 rounded-xl border border-border bg-[#fbfcfd] p-4">
    <span class="text-[12px]/[16px] font-medium text-text-secondary">تاريخ ووقت النهاية</span>
    <span class="text-[14px]/[20px] font-bold text-text-primary">{{ view().endsOnLabel }}</span>
  </div>
</div>
