<app-side-drawer title="تفاصيل الإعلان" footerTone="muted" (closed)="closed.emit()">
  @if (error(); as message) {
    <app-error-state [message]="message" (retry)="retry.emit()" />
  } @else if (detail(); as openDetail) {
    @if (view(); as openView) {
      <!-- 24px from the top and 16px from the sides, as the offers drawer sets out. -->
      <div class="flex flex-col gap-6 px-4 pt-6 pb-6">
        <section class="flex flex-col gap-2 text-start">
          <div class="flex items-start justify-between gap-3">
            <h3 class="text-[16px]/[24px] font-bold text-text-primary">
              {{ openDetail.ad.title }}
            </h3>
            <app-campaign-status-pill [status]="openDetail.ad.status" />
          </div>
          <p class="text-[12px]/[18px] text-text-secondary">{{ openDetail.text }}</p>
        </section>

        <app-ad-media-preview
          [contentType]="openDetail.ad.contentType"
          [mediaUrl]="openDetail.mediaUrl"
          [title]="openDetail.ad.title"
        />

        <app-ad-detail-facts [view]="openView" />
      </div>
    }
  } @else if (isLoading()) {
    <div class="flex flex-col gap-6 px-4 pt-6" aria-busy="true">
      <app-skeleton height="70px" />
      <app-skeleton height="180px" />
      <app-skeleton height="200px" />
    </div>
  }

  <!-- One @if around the element: projection only matches a direct child of the control flow block. -->
  @if (view(); as openView) {
    <app-ad-detail-actions
      drawerFooter
      [pauseAction]="openView.pauseAction"
      [isBusy]="isBusy()"
      (edit)="emitForOpenAd(edit)"
      (statusChange)="emitForOpenAd(statusChange)"
      (remove)="emitForOpenAd(remove)"
    />
  }
</app-side-drawer>
