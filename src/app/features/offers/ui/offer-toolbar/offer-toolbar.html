<app-filter-toolbar
  searchPlaceholder="ابحث عن عرض.."
  panelId="offer-filter-panel"
  [activeFilterCount]="activeFilterCount()"
  [controlGap]="controlGap"
  (searchChange)="searchChange.emit($event)"
  (sortChange)="sortChange.emit($event)"
>
  <ng-template let-close="close">
    <!-- Hangs 6px under the button, 2px in from its left edge, like the ads panel. -->
    <app-offer-filter-panel
      class="mt-1.5 ml-0.5"
      [filters]="filters()"
      (applied)="filtersApply.emit($event); close()"
      (closed)="close()"
    />
  </ng-template>
</app-filter-toolbar>
