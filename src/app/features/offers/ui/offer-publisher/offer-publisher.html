<section class="flex flex-col gap-2">
  <!-- RTL: the label on the right, the link to the store page on the left. -->
  <div class="flex items-start justify-between">
    <h3 class="text-[12px]/[16px] font-bold tracking-[0.3px] text-text-secondary">
      المتجر الناشر للعرض
    </h3>
    <a
      data-role="place-link"
      class="flex items-center gap-1 text-[12px]/[16px] font-medium text-primary hover:underline"
      [routerLink]="placeLink()"
    >
      <app-icon name="external-link" [size]="12" aria-hidden="true" />
      <span>عرض تفاصيل المتجر</span>
    </a>
  </div>

  <!-- RTL: the 48px letter tile on the right, the store text 12px to its left. -->
  <div class="flex items-center gap-3">
    <span
      data-role="place-initial"
      class="flex size-12 shrink-0 items-center justify-center rounded-2xl bg-accent text-[16px]/[32px] font-bold tracking-[-0.24px] text-white"
      aria-hidden="true"
    >
      {{ initial() }}
    </span>
    <div class="flex min-w-0 flex-col gap-1 text-start">
      <p class="text-[14px]/[20px] font-bold text-text-primary">{{ place().name }}</p>
      <p class="pb-1 text-[12px]/[16px] text-text-secondary">{{ place().categoryName }}</p>
      <p class="pb-1 text-[12px]/[16px] text-text-secondary">{{ place().address }}</p>
    </div>
  </div>
</section>
