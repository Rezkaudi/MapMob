<app-filter-popover
  panelId="offer-filter-panel"
  heading="تصفية العروض"
  [canApply]="canApply()"
  (applied)="apply()"
  (reset)="reset()"
  (closed)="closed.emit()"
>
  <div class="flex flex-col gap-1.5">
    <span class="text-[12px]/[16px] font-bold text-text-primary">الحالة</span>
    <app-choice-chips
      label="الحالة"
      layout="fill"
      [options]="statusOptions"
      [selected]="draft().status"
      (selectedChange)="pickStatus($event)"
    />
  </div>

  <div class="flex flex-col gap-2.5 border-t border-[#f1f5f9] pt-3">
    <span class="text-[12px]/[16px] font-bold text-text-primary">تاريخ العرض</span>
    <app-date-range-fields
      [range]="draft().runningRange"
      [hasFixedWidthFields]="true"
      (rangeChange)="changeRange($event)"
    />
  </div>
</app-filter-popover>
