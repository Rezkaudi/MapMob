<section
  class="flex flex-col gap-4 rounded-2xl xl:h-[410px] border border-border bg-surface p-6 shadow-[0_4px_20px_0_rgba(238,238,238,0.9)]"
  [attr.aria-busy]="isLoading() ? 'true' : null"
>
  <app-overview-card-heading
    title="أحدث التفاعلات والتنبيهات"
    [viewAllRoute]="notificationsRoute"
  />

  @if (isLoading()) {
    <div class="flex flex-col gap-3">
      @for (row of placeholderRows; track row) {
        <app-skeleton height="60px" />
      }
    </div>
  } @else {
    <ul class="flex flex-col gap-3 overflow-y-auto">
      @for (row of rows(); track row.id) {
        <!-- RTL: the icon tile is written first so it sits on the right of the words. -->
        <li
          class="flex min-h-[60px] shrink-0 items-center gap-4 rounded-xl px-4 py-2"
          [class]="row.skin.rowClass"
        >
          <span
            class="flex size-[34px] shrink-0 items-center justify-center rounded-lg text-white"
            [class]="row.skin.tileClass"
          >
            <app-icon [name]="row.skin.icon" [size]="18" />
          </span>
          <span class="text-right text-[14px]/[24px] text-text-primary">{{ row.message }}</span>
        </li>
      } @empty {
        <li class="py-10 text-center text-[14px] text-text-secondary">لا توجد تفاعلات جديدة</li>
      }
    </ul>
  }
</section>
