<app-auth-form-frame>
  <div class="flex w-full flex-col gap-8">
    <app-auth-heading
      title="نسيت كلمة المرور؟"
      description="لا تقلق ،أدخل البريد الإلكتروني المرتبط بحسابك، وسنرسل رمز تحقق إلى بريدك الإلكتروني."
      [backRoute]="routes.login"
    />

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      novalidate
      class="flex min-h-[283px] w-full flex-col gap-6 pb-4"
    >
      <app-auth-text-field
        label="البريد الالكتروني"
        inputId="email"
        placeholder="name@gmail.com"
        [control]="form.controls.email"
      />

      <app-auth-form-error [message]="errorMessage()" />

      <app-auth-submit-button
        label="إرسال رمز التحقق"
        busyLabel="جاري إرسال الرمز"
        [isBusy]="store.isLoading()"
      />
    </form>
  </div>
</app-auth-form-frame>
