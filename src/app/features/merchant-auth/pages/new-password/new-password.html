<app-auth-form-frame>
  <div class="flex w-full flex-col gap-8">
    <app-auth-heading
      title="إنشاء كلمة مرور جديدة"
      description="أدخل كلمة المرور الجديدة لحسابك."
    />

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      novalidate
      class="flex min-h-[283px] w-full flex-col gap-6 pb-4"
    >
      <app-auth-password-field
        label="كلمة المرور الجديدة"
        inputId="new-password"
        autocomplete="new-password"
        [control]="form.controls.password"
      />
      <app-auth-password-field
        label="تأكيد كلمة المرور"
        inputId="password-confirmation"
        autocomplete="new-password"
        [control]="form.controls.confirmation"
      />

      <app-auth-form-error [message]="errorMessage()" />

      <app-auth-submit-button
        label="تحديث كلمة المرور"
        busyLabel="جاري حفظ كلمة المرور"
        [isBusy]="store.isLoading()"
      />
    </form>
  </div>
</app-auth-form-frame>
