@if (rows().length) {
  <ul class="flex flex-col gap-3">
    @for (row of rows(); track row.id) {
      <!-- RTL: the tile and names on the right, the saved time on the left. -->
      <li class="flex h-16 items-center justify-between gap-3 rounded-lg bg-[#f2f4f6] p-3">
        <div class="flex min-w-0 items-center gap-3">
          <span
            class="flex size-10 shrink-0 items-center justify-center rounded text-white"
            [class]="row.tileClass"
            aria-hidden="true"
          >
            <app-icon [name]="row.icon" [size]="16" />
          </span>
          <div class="flex min-w-0 flex-col">
            <span class="truncate text-[14px]/[20px] font-medium text-text-primary">{{
              row.placeName
            }}</span>
            <span class="truncate text-[12px]/[14px] text-text-secondary">{{ row.metaLabel }}</span>
          </div>
        </div>
        <span class="shrink-0 text-[11px]/[14px] text-text-secondary">{{ row.savedLabel }}</span>
      </li>
    }
  </ul>
} @else {
  <p class="py-6 text-center text-[14px] text-text-secondary">لا توجد أماكن مفضلة</p>
}
