<!-- RTL: "الكل" sits on the right; inside each option the dot leads, 6px before the label. -->
<div
  role="radiogroup"
  class="flex h-9 gap-2 rounded-xl bg-[#f1f5f9] p-1"
  [attr.aria-label]="label()"
>
  @for (item of items(); track item.option.label) {
    <button
      type="button"
      role="radio"
      class="flex h-7 min-w-0 flex-1 items-center justify-center gap-1.5 rounded-lg text-[12px]/[16px] transition-colors"
      [class]="item.buttonClasses"
      [attr.aria-checked]="item.isPicked"
      (click)="selectedChange.emit(item.option.value)"
    >
      <span
        class="size-2 shrink-0 rounded-full"
        [class]="item.dotClasses"
        aria-hidden="true"
      ></span>
      <span>{{ item.option.label }}</span>
    </button>
  }
</div>
