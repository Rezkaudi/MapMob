<!-- RTL: the 390px search on the right; sort then "الفلاتر" (16px apart) on the left. -->
<div class="flex items-center justify-between gap-4 rounded-xl border border-border bg-surface p-4">
  <app-list-search-field
    class="w-full max-w-[390px]"
    placeholder="ابحث عن مستخدم..."
    (searchChange)="searchChange.emit($event)"
  />

  <div class="flex shrink-0 items-center gap-4">
    <app-sort-select (sortChange)="sortChange.emit($event)" />

    <div class="relative">
      <button
        type="button"
        aria-controls="user-filter-panel"
        class="flex h-[42px] items-center gap-2.5 rounded-xl border border-primary bg-[#f0f7fe] px-4 text-[14px]/[20px] font-bold text-primary hover:bg-primary-soft"
        [attr.aria-expanded]="isFilterPanelOpen()"
        [attr.aria-label]="filterButtonLabel()"
        (click)="toggleFilterPanel()"
      >
        <app-icon name="filter" [size]="14" aria-hidden="true" />
        <span>الفلاتر</span>
      </button>

      @if (isFilterPanelOpen()) {
        <!-- Hangs 5px under the button, lined up with its left edge. -->
        <app-user-filter-panel
          class="absolute top-[calc(100%+5px)] left-0 z-30"
          [filters]="filters()"
          (applied)="applyFilters($event)"
          (closed)="closeFilterPanel()"
        />
      }
    </div>
  </div>
</div>
