<!-- Header, the stat cards 20px below, the toolbar 40px below them, the table 30px below that, paging 8px under it. -->
<app-page-header
  title="المستخدمين"
  description="إدارة ومتابعة مستخدمي المنصة."
  [isAddVisible]="false"
>
  <app-export-button pageHeaderAction [isBusy]="store.isExporting()" (pressed)="exportUsers()" />
</app-page-header>

<div class="mt-5 grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-4">
  @for (card of store.statCards(); track card.label) {
    <app-stat-card
      [isLoading]="store.isSummaryLoading()"
      [icon]="card.icon"
      [label]="card.label"
      [value]="card.value"
    />
  }
</div>

@if (store.error(); as error) {
  <app-error-state class="mt-10" [message]="error" (retry)="store.loadUsers()" />
} @else {
  <app-user-toolbar
    class="mt-10"
    [filters]="store.filters()"
    [activeFilterCount]="store.activeFilterCount()"
    (searchChange)="store.setSearch($event)"
    (sortChange)="store.setSort($event)"
    (filtersApply)="store.applyFilters($event)"
  />

  <app-user-table
    class="mt-[30px]"
    [entries]="store.entries()"
    [selectedIdSet]="store.selectedIdSet()"
    [areAllSelected]="store.areAllVisibleSelected()"
    [isLoading]="store.isLoading()"
    [hasNoResults]="store.hasNoResults()"
    [emptyMessage]="store.emptyMessage()"
    [rowCount]="store.pageSize()"
    (rowToggle)="store.toggleSelected($event)"
    (allToggle)="store.toggleAllVisible()"
    (view)="openDetail($event)"
    (statusChange)="dialogFlow.openStatusChange($event)"
    (remove)="dialogFlow.openDelete($event)"
  />

  <app-table-pagination
    class="mt-2"
    [pageIndex]="store.pageIndex()"
    [pageSize]="store.pageSize()"
    [totalCount]="store.totalCount()"
    itemNoun="مستخدم"
    (pageIndexChange)="store.changePage($event)"
  />
}

<app-user-dialogs
  [request]="dialogFlow.request()"
  [isBusy]="store.isSaving()"
  (confirmed)="dialogFlow.confirm()"
  (closed)="closeDialog()"
/>

@if (store.saveError(); as saveError) {
  <app-toast
    tone="error"
    title="تعذر إتمام العملية"
    [message]="saveError"
    (dismissed)="store.clearSaveError()"
  />
}
