<!-- Same card, fields and footer as "إضافة دفعة جديدة"; the place and plan cannot change here. -->
<app-dialog-frame
  [isBusy]="store.isSaving()"
  appearance="roomy"
  heading="تعديل الدفعة"
  subheading="صحّح المبلغ أو العملة أو تاريخ الدفع أو الملاحظات لهذه الدفعة."
  headingIcon="payments"
  (closed)="store.close()"
>
  <form class="flex flex-col gap-4" novalidate (submit)="$event.preventDefault(); store.submit()">
    <div class="flex gap-3">
      <div class="flex min-w-0 flex-1 flex-col gap-1">
        <p class="text-[12px]/[16px] font-bold text-[#334155]">التاجر / المكان</p>
        <p
          data-testid="payment-place"
          class="flex h-12 items-center truncate rounded-lg bg-[#F2F4F6] px-5 text-[16px] text-text-primary"
        >
          {{ store.companyName() }}
        </p>
      </div>
      <div class="flex w-[160px] shrink-0 flex-col gap-1">
        <p class="text-[12px]/[16px] font-bold text-[#334155]">رقم العملية</p>
        <p
          data-testid="payment-number"
          dir="ltr"
          class="flex h-12 items-center justify-end rounded-lg bg-[#F2F4F6] px-5 text-[16px] font-bold text-text-primary"
        >
          {{ store.transactionNumber() }}
        </p>
      </div>
    </div>

    <div class="flex flex-col gap-1">
      <label for="edit-payment-amount" class="text-[12px]/[16px] font-bold text-[#334155]">
        المبلغ المستلم <span class="text-status-error" aria-hidden="true">*</span>
      </label>
      <!-- RTL: the number keeps the right of the box and the currency chip sits on the left. -->
      <div class="relative">
        <!-- `dir="ltr"` keeps the grouped number readable, so its padding must be physical. -->
        <input
          id="edit-payment-amount"
          data-testid="payment-amount"
          type="text"
          inputmode="numeric"
          dir="ltr"
          class="h-12 w-full rounded-lg bg-[#F2F4F6] pr-5 pl-20 text-right text-[24px]/[32px] font-bold tracking-[-0.24px] text-primary outline-none"
          [value]="groupedAmount()"
          (input)="onAmountInput($event)"
        />
        <app-currency-select
          data-testid="payment-currency"
          class="absolute end-[13px] top-[6.5px]"
          variant="square"
          label="عملة المبلغ"
          [currency]="store.currency()"
          (currencyChange)="onCurrencyChange($event)"
        />
      </div>
    </div>

    <div class="flex flex-col gap-1">
      <label for="edit-payment-paid-at" class="text-[12px]/[16px] font-bold text-[#334155]">
        تاريخ الدفع <span class="text-status-error" aria-hidden="true">*</span>
      </label>
      <div class="relative">
        <input
          id="edit-payment-paid-at"
          data-testid="payment-paid-at"
          type="date"
          class="h-12 w-full rounded-lg bg-[#F2F4F6] ps-11 pe-4 text-left text-[14px] text-text-primary outline-none [&::-webkit-calendar-picker-indicator]:opacity-0"
          [value]="store.paidAt()"
          (input)="onPaidAtInput($event)"
        />
        <app-icon
          name="calendar-outline"
          [size]="18"
          class="pointer-events-none absolute start-4 top-1/2 -translate-y-1/2 text-text-secondary"
          aria-hidden="true"
        />
      </div>
    </div>

    <div class="flex flex-col gap-1">
      <label for="edit-payment-notes" class="text-[12px]/[16px] font-bold text-[#334155]">
        ملاحظات <span class="text-[11px] font-normal text-text-secondary">(اختياري)</span>
      </label>
      <textarea
        id="edit-payment-notes"
        data-testid="payment-notes"
        rows="2"
        class="min-h-[68px] w-full resize-none rounded-lg bg-[#F2F4F6] px-4 pt-4 pb-[34px] text-right text-[13px]/[18px] text-text-primary outline-none"
        [value]="store.notes()"
        (input)="onNotesInput($event)"
      ></textarea>
    </div>

    @if (store.saveError(); as saveError) {
      <p role="alert" class="text-[13px]/[18px] text-status-error">{{ saveError }}</p>
    }
  </form>

  <!-- RTL: justify-end packs the pair left, so "إلغاء" comes first and lands on the right. -->
  <button
    dialogFooter
    type="button"
    data-testid="payment-cancel"
    class="h-[42px] rounded-[4px] border border-border bg-white px-5 text-[14px]/[20px] font-medium text-text-primary hover:bg-surface-muted disabled:cursor-not-allowed disabled:opacity-60"
    (click)="store.close()"
    [disabled]="store.isSaving()"
  >
    إلغاء
  </button>
  <button
    dialogFooter
    type="button"
    data-testid="payment-submit"
    class="h-[46px] rounded-[4px] bg-primary px-4 text-[14px]/[20px] font-medium text-white shadow-[0_1px_2px_0_rgba(0,0,0,0.05)] hover:bg-primary-hover disabled:cursor-not-allowed disabled:opacity-50"
    [disabled]="!store.canSubmit()"
    [attr.aria-busy]="store.isSaving()"
    (click)="store.submit()"
  >
    <app-busy-label [isBusy]="store.isSaving()">حفظ التعديلات</app-busy-label>
  </button>
</app-dialog-frame>
