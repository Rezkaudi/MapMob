<section
  class="relative overflow-hidden rounded-2xl border border-border bg-surface p-6"
  aria-labelledby="subscription-hero-title"
>
  <!-- The soft blue glow the frame parks behind the buttons' corner. -->
  <span
    class="pointer-events-none absolute -top-[47px] -left-[47px] size-48 rounded-full bg-primary/5 blur-[20px]"
    aria-hidden="true"
  ></span>

  <!-- RTL: the plan block comes first, so it sits on the right and the buttons on the left. -->
  <div class="relative flex flex-col gap-6 lg:flex-row lg:items-center lg:justify-between">
    <div class="flex flex-col items-start gap-4">
      <div class="flex items-center gap-3">
        <span
          data-role="current-chip"
          class="rounded-lg border border-border bg-[#F1F5F9] px-2 py-1 text-[12px]/[16px] font-bold tracking-[0.6px] text-text-secondary"
          >باقتك الحالية</span
        >
        <app-subscription-status-badge [status]="hero().status" />
      </div>

      <div class="flex flex-wrap items-center gap-3">
        <h2
          id="subscription-hero-title"
          class="text-[30px]/[36px] font-black tracking-[-0.75px] text-text-primary"
        >
          {{ hero().planName }}
        </h2>
        <p class="flex items-center gap-[3.55px]">
          <span data-role="amount" class="text-[24px]/[32px] font-extrabold text-primary">{{
            hero().amountText
          }}</span>
          <span data-role="period" class="text-[14px]/[20px] font-bold text-text-secondary">{{
            hero().periodText
          }}</span>
        </p>
      </div>

      <dl class="flex flex-wrap gap-4 pt-1">
        <div
          data-role="fact"
          class="flex min-w-[132px] flex-col gap-1 rounded-xl border border-border/80 bg-surface-muted p-3"
        >
          <dt class="text-[12px]/[16px] text-text-secondary">تاريخ بداية الاشتراك</dt>
          <dd dir="ltr" class="text-end text-[14px]/[20px] font-bold text-text-primary">
            {{ hero().startsOnText }}
          </dd>
        </div>
        <div
          data-role="fact"
          class="flex min-w-[132px] flex-col gap-1 rounded-xl border border-border/80 bg-surface-muted p-3"
        >
          <dt class="text-[12px]/[16px] text-text-secondary">تاريخ انتهاء الاشتراك</dt>
          <dd dir="ltr" class="text-end text-[14px]/[20px] font-bold text-text-primary">
            {{ hero().endsOnText }}
          </dd>
        </div>
        <div
          data-role="fact"
          class="flex min-w-[160px] flex-col gap-1 rounded-xl border border-border/80 bg-surface-muted p-3"
        >
          <dt class="text-[12px]/[16px] text-text-secondary">طريقة السداد المعتمدة</dt>
          <dd class="text-[14px]/[20px] font-bold text-text-primary">
            {{ hero().paymentMethodText }}
          </dd>
        </div>
      </dl>
    </div>

    <!-- The divider sits on the buttons' right edge, 32px from them. -->
    <div class="flex flex-col gap-3 lg:border-s lg:border-border lg:ps-8">
      @if (hero().upgradeTarget) {
        <button
          data-role="upgrade"
          type="button"
          class="h-11 rounded-lg border border-primary bg-primary px-5 text-[16px]/[16px] font-bold tracking-[0.5px] text-surface-muted hover:bg-primary-hover disabled:cursor-not-allowed disabled:opacity-50 lg:w-[221px]"
          [disabled]="!hero().canUpgrade"
          (click)="upgrade.emit()"
        >
          ترقية الباقة
        </button>
      }
      <button
        data-role="details"
        type="button"
        class="h-11 rounded-lg border border-border bg-surface px-5 text-[16px]/[16px] font-bold tracking-[0.5px] text-text-primary hover:bg-surface-muted lg:w-[221px]"
        (click)="details.emit()"
      >
        تفاصيل الاشتراك
      </button>
    </div>
  </div>
</section>
