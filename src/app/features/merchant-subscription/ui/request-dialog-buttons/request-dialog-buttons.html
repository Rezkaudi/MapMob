<!-- The footer packs its buttons left; the first one lands on the right. -->
<button
  type="button"
  class="h-11 rounded-lg border border-border bg-surface px-5 text-[12px]/[16px] text-text-primary hover:bg-surface-muted"
  (click)="cancelled.emit()"
>
  إلغاء
</button>
<button
  type="button"
  class="h-10 min-w-[125px] rounded-lg bg-primary px-3 text-[12px]/[16px] font-bold text-white shadow-[0_1px_2px_0_rgba(0,0,0,0.05)] hover:bg-primary-hover disabled:cursor-wait disabled:opacity-60"
  [disabled]="isBusy()"
  [attr.aria-busy]="isBusy()"
  (click)="confirmed.emit()"
>
  {{ confirmLabel() }}
</button>
