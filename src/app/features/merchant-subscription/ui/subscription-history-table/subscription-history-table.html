<section class="overflow-hidden rounded-2xl border border-border bg-surface">
  <app-section-heading
    class="gap-0! border-b border-border p-6"
    title="سجل الاشتراكات"
    description="الاطلاع على سجل اشتراكات متجرك السابقة والحالية وتفاصيل الدفع النقدي."
  />

  <div class="overflow-x-auto">
    <!--
      Column widths from the frame. The plan column starts 66px in from the card's right
      edge, and the actions column keeps the 42px the frame leaves on the left.
    -->
    <table class="w-full min-w-[1000px] table-fixed text-start">
      <colgroup>
        <col class="w-[216px]" />
        <col class="w-[89px]" />
        <col class="w-[128px]" />
        <col class="w-[135px]" />
        <col class="w-[125px]" />
        <col class="w-[123px]" />
        <col />
      </colgroup>
      <thead class="border-b border-border bg-surface-muted/80">
        <tr class="text-[12px]/[16px] font-bold text-text-secondary">
          <th scope="col" class="ps-[66px] pe-6 py-4 text-start">الباقة</th>
          <th scope="col" class="px-6 py-4 text-start">المدة</th>
          <th scope="col" class="px-6 py-4 text-start">المبلغ</th>
          <th scope="col" class="px-6 py-4 text-start">تاريخ الاشتراك</th>
          <th scope="col" class="px-6 py-4 text-start">تاريخ الانتهاء</th>
          <th scope="col" class="px-6 py-4 text-start">الحالة</th>
          <th scope="col" class="ps-6 pe-[66px] py-4 text-center">الإجراءات</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track row.record.id) {
          <tr class="h-[63px] border-t border-border first:border-t-0">
            <td class="ps-[66px] pe-6 text-[14px]/[20px] font-bold text-text-primary">
              {{ row.planName }}
            </td>
            <td class="px-6 text-[12px]/[16px] font-medium text-text-secondary">
              {{ row.termLabel }}
            </td>
            <td class="px-6 text-[12px]/[16px] font-bold whitespace-nowrap text-text-primary">
              {{ row.amountText }}
            </td>
            <td class="px-6 text-[12px]/[16px] font-medium whitespace-nowrap text-text-primary">
              <span dir="ltr">{{ row.startsOnText }}</span>
            </td>
            <td class="px-6 text-[12px]/[16px] font-medium whitespace-nowrap text-text-primary">
              <span dir="ltr">{{ row.endsOnText }}</span>
            </td>
            <td class="px-6"><app-subscription-status-pill [status]="row.status" /></td>
            <td class="ps-6 pe-[66px] text-center">
              <!-- RTL: the eye comes first, so it sits right of the words. -->
              <button
                type="button"
                class="inline-flex items-center gap-1 rounded-[4px] border border-border px-3 py-1.5 text-[12px]/[16px] font-bold text-text-secondary hover:bg-surface-muted"
                [attr.aria-label]="'عرض تفاصيل ' + row.planName + ' ' + row.startsOnText"
                (click)="view.emit(row.record)"
              >
                <app-icon name="eye-line-small" [size]="14" aria-hidden="true" />
                عرض التفاصيل
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
