<h3 class="text-[12px]/[16px] font-bold" [class]="skin().heading">حدود الاستخدام والمزايا:</h3>
<ul class="flex flex-col gap-[14px]">
  @for (feature of features(); track $index) {
    <!-- RTL: the tick comes first, so it sits on the right. -->
    <li class="flex items-center" [class]="skin().gap">
      <app-icon name="check-thin" [size]="16" class="text-status-success" aria-hidden="true" />
      <span class="text-[12px]/[16px]" [class]="skin().item">{{ feature }}</span>
    </li>
  }
</ul>
