<section data-role="plan-column" class="flex flex-col rounded-2xl p-4" [class]="skin().card">
  <!-- RTL: the heading comes first, so it sits on the right and the plan chip on the left. -->
  <header class="flex items-center justify-between gap-2 border-b pb-2" [class]="skin().divider">
    <h3 class="text-[12px]/[16px] font-bold text-text-primary">{{ heading() }}</h3>
    <span class="rounded-lg px-2.5 py-0.5 text-[11px]/[16.5px] font-bold" [class]="skin().chip">{{
      column().name
    }}</span>
  </header>
  <dl class="flex flex-col gap-2 pt-3">
    @for (row of column().rows; track row.label) {
      <div class="flex items-center justify-between gap-2 py-0.5">
        <dt class="text-[12px]/[16px] text-text-secondary">{{ row.label }}</dt>
        <dd
          class="text-[14px]/[20px]"
          [class]="row.isUnavailable ? 'font-medium text-[#94A3B8]' : 'font-bold text-text-primary'"
        >
          {{ row.value }}
        </dd>
      </div>
    }
  </dl>
</section>
