<section
  class="flex flex-col gap-6 rounded-2xl border border-border bg-surface px-[17px] py-[25px] drop-shadow-[0_4px_10px_rgba(238,238,238,0.9)]"
  [attr.aria-busy]="isLoading() ? 'true' : null"
>
  <header class="flex items-center justify-between gap-4">
    <div class="flex flex-col items-end">
      <h2 class="text-[16px]/[24px] font-bold text-text-primary">يحتاج إلى إجراء</h2>
      <p class="text-[16px]/[24px] text-text-secondary">عناصر تحتاج إلى مراجعتك</p>
    </div>
    <a href="javascript:void(0)" class="text-[14px]/[24px] font-bold text-accent">عرض الكل</a>
  </header>

  @if (isLoading()) {
    <div class="flex flex-col gap-4">
      @for (row of placeholderRows; track row) {
        <app-skeleton height="60px" />
      }
    </div>
  } @else {
    <ul class="flex flex-col gap-4">
      @for (row of rows(); track row.item.id) {
        <li
          class="flex h-[60px] items-center justify-between rounded-xl p-4"
          [class]="rowClasses[row.item.tone]"
        >
          <!-- RTL: the tinted icon tile leads on the right, the review button sits on the left. -->
          <div class="flex items-center gap-4">
            <span
              class="flex shrink-0 items-center justify-center rounded-lg p-2 text-white"
              [class]="iconClasses[row.item.tone]"
            >
              <app-icon [name]="iconNames[row.item.tone]" [size]="18" />
            </span>
            <span class="text-[14px]/[24px] text-text-primary"
              >{{ row.item.count }} {{ row.item.label }}</span
            >
          </div>

          @if (row.reviewRoute; as reviewRoute) {
            <a
              data-role="review"
              [routerLink]="reviewRoute"
              class="rounded-lg px-4 py-2 text-[16px]/[24px] font-bold text-text-primary"
            >
              مراجعة
            </a>
          }
        </li>
      }
    </ul>
  }
</section>
