<app-filter-popover
  panelId="owner-review-filter-panel"
  heading="تصفية التقييمات"
  headerAppearance="plain"
  [canApply]="canApply()"
  (applied)="apply()"
  (reset)="reset()"
  (closed)="closed.emit()"
>
  <div class="flex flex-col gap-1.5">
    <span class="text-[12px]/[16px] font-bold text-text-primary">التقييم</span>
    <app-choice-chips
      label="التقييم"
      layout="fill"
      [options]="ratingChoices"
      [selected]="selectedRating()"
      (selectedChange)="pickRating($event)"
    />
  </div>

  <div class="flex flex-col gap-1.5">
    <span class="text-[12px]/[16px] font-bold text-text-primary">حالة البلاغ</span>
    <app-choice-chips
      label="حالة البلاغ"
      [options]="reportStatusChoices"
      [selected]="draft().reportStatus"
      (selectedChange)="pickReportStatus($event)"
    />
  </div>

  <app-date-period-filter
    heading="الفترة الزمنية"
    [hasFixedWidthFields]="true"
    [period]="draft().period"
    [customRange]="draft().customRange"
    (periodChange)="pickPeriod($event)"
    (customRangeChange)="changeCustomRange($event)"
  />
</app-filter-popover>
