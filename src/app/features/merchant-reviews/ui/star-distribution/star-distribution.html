<!-- RTL: the star number on the right, the bar filling from it, the count on the left. -->
<h3 class="pb-1 text-[12px]/[16px] font-bold tracking-[0.6px] text-text-secondary">توزيع النجوم</h3>
<ul>
  @for (row of labelledRows(); track row.stars) {
    <li class="flex items-center gap-3 pt-2.5">
      <span class="flex w-12 shrink-0 items-center gap-1">
        <span data-role="stars" class="text-[12px]/[16px] font-medium text-text-primary">{{
          row.stars
        }}</span>
        <app-icon name="star-solid" [size]="12" class="text-[#fbbf24]" aria-hidden="true" />
      </span>
      <app-share-bar
        class="flex-1"
        size="slim"
        tone="yellow"
        [share]="row.sharePercent"
        [label]="row.barLabel"
      />
      <span
        data-role="count"
        dir="ltr"
        class="w-14 shrink-0 text-left text-[12px]/[16px] font-bold text-text-primary"
        >{{ row.countText }}</span
      >
    </li>
  }
</ul>
