<app-form-dialog-frame heading="تفاصيل المراجعة" appearance="notice" (closed)="closed.emit()">
  <!-- RTL: who and when on the right, the score box on the left. -->
  <div
    class="flex items-center justify-between gap-4 rounded-xl border border-border bg-[rgba(248,250,252,0.8)] p-4"
  >
    <div class="flex flex-col items-start gap-1">
      <h3 data-role="author" class="text-[16px]/[24px] font-bold text-text-primary">
        {{ review().author.name }}
      </h3>
      <span data-role="date" class="text-[12px]/[16px] text-text-secondary">{{
        review().createdAt | arabicDate
      }}</span>
    </div>

    <div
      class="flex shrink-0 flex-col items-end gap-0.5 rounded-xl border border-[#f1f5f9] bg-white p-2.5 shadow-[0_1px_2px_0_rgba(0,0,0,0.05)]"
    >
      @if (review().rating; as rating) {
        <app-star-rating starStyle="amber" fillDirection="rtl" [rating]="rating" [gap]="6" />
      }
      <!-- RTL: the score on the right, "/5.0" after it on the left. -->
      <div class="flex items-center gap-1">
        <span data-role="score" class="text-[18px]/[28px] font-black text-text-primary">{{
          scoreText()
        }}</span>
        <span dir="ltr" class="text-[12px]/[16px] font-medium text-[#94a3b8]">{{
          topRatingLabel
        }}</span>
      </div>
    </div>
  </div>

  <div class="flex flex-col gap-1.5">
    <h3 class="text-[12px]/[16px] font-bold text-text-primary">نص المراجعة الكامل:</h3>
    <p
      data-role="comment"
      class="rounded-xl border border-border bg-surface-muted p-4 text-[14px]/[22.75px] whitespace-pre-line text-text-primary"
    >
      “{{ review().comment }}”
    </p>
  </div>

  <!-- RTL: the footer packs to the left; "إلغاء" is written first so it sits right of the report. -->
  <button
    formDialogFooter
    type="button"
    class="h-11 rounded-lg border border-border bg-white px-5 text-[12px]/[16px] text-text-primary hover:bg-surface-muted"
    (click)="closed.emit()"
  >
    إلغاء
  </button>
  @if (canReport()) {
    <button
      formDialogFooter
      type="button"
      class="flex h-11 items-center gap-1.5 rounded-lg border border-closed px-3.5 text-[12px]/[16px] font-bold text-closed hover:bg-closed/5"
      (click)="report.emit()"
    >
      <app-icon name="flag-feather" [size]="16" aria-hidden="true" />
      <span>الإبلاغ عن المراجعة</span>
    </button>
  }
</app-form-dialog-frame>
