<div class="flex max-w-[716px] flex-col gap-4 rounded-lg bg-[#f2f4f6] p-4">
  <span class="pb-1 text-start text-[12px]/[16px] font-bold text-[#191c1e]">
    معايير التخصيص الجغرافي والسلوكي
  </span>

  <!-- RTL: the governorate on the right, the area on the left; each chevron sits 32px in from the left. -->
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <label class="flex flex-col gap-1">
      <span class="text-start text-[12px]/[16px] font-medium text-text-secondary">المحافظة</span>
      <span class="relative block">
        <select
          aria-label="المحافظة"
          class="h-[42px] w-full appearance-none rounded-lg bg-white pr-5 pl-14 text-[13px]/[16px] text-text-primary outline-none focus-visible:ring-1 focus-visible:ring-primary"
          [attr.aria-invalid]="error() !== null"
          (change)="pickGovernorate($event)"
        >
          <option value="" [selected]="!governorateId()">اختر المحافظة</option>
          @for (governorate of governorates(); track governorate.id) {
            <option [value]="governorate.id" [selected]="governorate.id === governorateId()">
              محافظة {{ governorate.name }}
            </option>
          }
        </select>
        <app-icon
          name="chevron-down-small"
          [size]="16"
          class="pointer-events-none absolute top-1/2 left-8 -translate-y-1/2 text-text-primary"
        />
      </span>
    </label>

    <label class="flex flex-col gap-1">
      <span class="text-start text-[12px]/[16px] font-medium text-text-secondary">المنطقة</span>
      <span class="relative block">
        <select
          aria-label="المنطقة"
          class="h-[42px] w-full appearance-none rounded-lg bg-white pr-5 pl-14 text-[13px]/[16px] text-[#191c1e] outline-none focus-visible:ring-1 focus-visible:ring-primary"
          [disabled]="!governorateId()"
          (change)="pickArea($event)"
        >
          <option value="" [selected]="!areaId()">الكل</option>
          @for (area of areas(); track area.id) {
            <option [value]="area.id" [selected]="area.id === areaId()">{{ area.name }}</option>
          }
        </select>
        <app-icon
          name="chevron-down-small"
          [size]="16"
          class="pointer-events-none absolute top-1/2 left-8 -translate-y-1/2 text-text-primary"
        />
      </span>
    </label>
  </div>

  @if (error(); as message) {
    <p role="alert" class="text-start text-[12px]/[16px] text-closed">{{ message }}</p>
  }

  @if (estimateLabels(); as labels) {
    <div
      class="flex flex-col items-start rounded-lg bg-white p-4 shadow-[0_1px_2px_0_rgba(0,0,0,0.05)]"
      aria-live="polite"
    >
      <span class="text-[18px]/[28px] font-medium text-[#191c1e]">{{ labels.count }}</span>
      <span class="text-[11px]/[14px] text-accent">{{ labels.share }}</span>
    </div>
  }
</div>
