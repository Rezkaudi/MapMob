<app-notification-dialog-frame
  heading="إعادة إرسال الإشعار"
  subheading="تحديد موعد إعادة إرسال الإشعار للمستخدمين"
  headingIcon="refresh-ccw"
  (closed)="closed.emit()"
>
  <!-- RTL: the megaphone and the title on the right, the recipients on the left. -->
  <div
    class="flex items-center justify-between gap-3 rounded-lg border border-border bg-[#f2f4f6] p-4"
  >
    <div class="flex min-w-0 items-center gap-3">
      <span
        class="flex size-9 shrink-0 items-center justify-center rounded-lg bg-[#0075d5] text-white shadow-[0_1px_2px_0_rgba(0,0,0,0.05)]"
      >
        <app-icon name="megaphone-filled" [size]="20" aria-hidden="true" />
      </span>
      <div class="flex min-w-0 flex-col">
        <span class="text-[12px]/[14px] text-text-secondary">عنوان الإشعار</span>
        <span class="truncate text-[18px]/[28px] font-medium text-text-primary">
          {{ notification().title }}
        </span>
      </div>
    </div>
    <div class="flex shrink-0 flex-col items-start">
      <span class="pb-1 text-[12px]/[14px] text-text-secondary">المستلمون</span>
      <span
        class="rounded-xl bg-primary-tint px-4 py-1 text-[12px]/[16px] font-medium text-primary"
      >
        {{ view().recipientCountLabel }}
      </span>
    </div>
  </div>

  <section class="flex flex-col gap-3">
    <h3 class="text-[12px]/[16px] font-bold text-[#191c1e]">موعد إعادة الإرسال</h3>
    <div role="radiogroup" aria-label="موعد إعادة الإرسال" class="grid grid-cols-2 gap-3">
      @for (choice of timingChoices; track choice.timing) {
        <app-option-card
          [title]="choice.title"
          [description]="choice.description"
          size="tall"
          [isSelected]="timing() === choice.timing"
          (picked)="timing.set(choice.timing)"
        />
      }
    </div>

    @if (timing() === 'later') {
      <div class="flex flex-col gap-4 rounded-lg bg-[#f2f4f6] p-4">
        <span class="pb-1 text-[12px]/[16px] font-bold text-[#191c1e]">
          تحديد تاريخ ووقت الإرسال للإشعار المجدول
        </span>
        <!-- RTL: the date on the right, the time on the left. -->
        <div class="grid grid-cols-2 gap-4">
          <app-send-moment-field
            kind="date"
            label="تاريخ الإرسال"
            [value]="moment().day || null"
            (valueChange)="changeDay($event)"
          />
          <app-send-moment-field
            kind="time"
            label="وقت الإرسال"
            [value]="moment().time || null"
            (valueChange)="changeTime($event)"
          />
        </div>
      </div>
    }
  </section>

  <div dialogFooter class="flex items-center gap-4">
    <button
      type="button"
      class="h-[46px] rounded border border-closed px-4 text-[14px]/[20px] font-medium text-closed hover:bg-closed/5 disabled:opacity-60"
      [disabled]="isBusy()"
      (click)="remove.emit()"
    >
      حذف الإشعار
    </button>
    <button
      type="button"
      class="h-[46px] rounded bg-primary px-4 text-[14px]/[20px] font-medium text-white shadow-[0_1px_2px_0_rgba(0,0,0,0.05)] hover:bg-primary-hover disabled:cursor-not-allowed disabled:opacity-60"
      [disabled]="!canConfirm() || isBusy()"
      [attr.aria-busy]="isBusy()"
      (click)="confirm()"
    >
      إعادة إرسال الإشعار
    </button>
  </div>
</app-notification-dialog-frame>
