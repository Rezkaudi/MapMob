<!-- The frame leaves 30px empty under the later card before the card edge. -->
<div
  role="radiogroup"
  aria-label="موعد الإرسال"
  class="flex max-w-[753px] flex-col gap-3 pb-[30px]"
>
  <app-option-card
    size="featured"
    title="إرسال فوري الآن"
    description="سيتم الإرسال لكافة الأجهزة المستهدفة في غضون دقيقة واحدة من تأكيد الضغط."
    [isSelected]="!isLater()"
    (picked)="timingChange.emit('now')"
  />

  <div data-role="later-card" class="flex flex-col gap-3 rounded-xl" [class]="laterCardClasses()">
    <button
      type="button"
      role="radio"
      class="flex items-start gap-3 text-start focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
      [attr.aria-checked]="isLater()"
      (click)="timingChange.emit('later')"
    >
      <app-radio-dot [isChecked]="isLater()" />
      <span class="flex flex-col gap-[5.5px] pb-[3.5px]">
        <span class="text-[12px]/[16px] font-bold text-text-primary">جدولة الإشعار لاحقاً</span>
        <span class="text-[10px]/[15px] text-text-secondary">
          تحديد وقت وتاريخ الذروة لضمان فتح الإشعار بنسبة أعلى
        </span>
      </span>
    </button>

    <!-- RTL: the date on the right, the Damascus time on the left. -->
    <div class="grid grid-cols-1 gap-4 pt-3 sm:grid-cols-2">
      <app-send-moment-field
        kind="date"
        label="تاريخ الإرسال"
        [value]="sendDay()"
        (valueChange)="changeDay($event)"
      />
      <app-send-moment-field
        kind="time"
        label="ساعة الإرسال (توقيت دمشق)"
        [value]="sendTime()"
        (valueChange)="changeTime($event)"
      />
    </div>
  </div>

  @if (error(); as message) {
    <p role="alert" class="text-start text-[12px]/[16px] text-closed">{{ message }}</p>
  }
</div>
