<!-- RTL: the 390px search sits on the right with the 139px sort field to its left. -->
<div class="flex items-center gap-2 rounded-xl border border-border bg-surface p-4">
  <app-list-search-field
    class="w-full max-w-[390px]"
    [placeholder]="searchPlaceholder()"
    (searchChange)="searchChange.emit($event)"
  />
  <app-sort-select class="shrink-0" (sortChange)="sortChange.emit($event)" />
</div>
