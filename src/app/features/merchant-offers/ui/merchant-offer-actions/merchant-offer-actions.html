<!-- RTL: the first button lands on the right; each icon is written first so it leads its label. -->
<div class="flex items-center gap-3" [attr.aria-busy]="isBusy()">
  <button
    type="button"
    class="flex h-10 flex-1 items-center justify-center gap-1 rounded-lg bg-primary text-[12px]/[16px] font-bold text-white shadow-[0_1px_2px_0_rgba(0,0,0,0.05)] hover:bg-primary-hover disabled:cursor-not-allowed disabled:opacity-60"
    [disabled]="isBusy()"
    (click)="edit.emit()"
  >
    <app-icon name="edit-outline" [size]="14" aria-hidden="true" />
    <span>تعديل العرض</span>
  </button>

  @switch (pauseAction()) {
    @case ('pause') {
      <button
        type="button"
        class="h-[42px] border-border bg-white text-text-primary hover:bg-surface-muted"
        [class]="outlinedButton"
        [disabled]="isBusy()"
        (click)="pause.emit()"
      >
        <app-icon name="pause-outline" [size]="14" aria-hidden="true" />
        <span>إيقاف العرض</span>
      </button>
    }
    @case ('resume') {
      <button
        type="button"
        class="h-[42px] border-border bg-white text-text-primary hover:bg-surface-muted"
        [class]="outlinedButton"
        [disabled]="isBusy()"
        (click)="resume.emit()"
      >
        <app-icon name="play" [size]="14" aria-hidden="true" />
        <span>تفعيل العرض</span>
      </button>
    }
  }

  <button
    type="button"
    class="h-10 border-closed text-closed hover:bg-closed/5"
    [class]="outlinedButton"
    [disabled]="isBusy()"
    (click)="remove.emit()"
  >
    <app-icon name="trash-filled" [size]="12" aria-hidden="true" />
    <span>حذف</span>
  </button>
</div>
