<app-form-dialog-frame
  heading="إضافة وسائط"
  subheading="أضف صورة او فيديو جديداً لمكانك ليتمكن المستخدمون من التعرف عليك أكثر."
  (closed)="cancelled.emit()"
>
  <!-- RTL: the blue info mark leads on the right, then the notice. -->
  <p
    data-role="notice"
    class="flex min-h-11 items-center gap-2 rounded-lg bg-[#f2f4f6] px-[19px] py-3 text-[12px]/[15px] text-text-primary"
  >
    <app-icon name="info-circle-filled" [size]="17" class="text-primary" aria-hidden="true" />
    <span>{{ dialog().notice }}</span>
  </p>

  <div class="flex flex-col gap-1.5">
    <app-field-label size="compact" text="نوع الوسائط" />
    <app-media-kind-choice
      [selected]="kind()"
      [canAddImage]="dialog().canAddImage"
      [canAddVideo]="dialog().canAddVideo"
      (selectedChange)="selectKind($event)"
    />
  </div>

  <div class="flex flex-col gap-2">
    <app-field-label size="compact" [text]="uploadCopy().fieldLabel" />
    @if (picked(); as file) {
      <!-- RTL: the preview leads on the right, the name and size follow, "حذف" ends on the left. -->
      <div data-role="picked-file" class="flex items-center gap-3 rounded-lg bg-[#f2f4f6] p-3">
        @if (isImage()) {
          <img
            [src]="file.previewUrl"
            [alt]="file.file.name"
            class="size-16 rounded-lg object-cover"
          />
        } @else {
          <span
            class="flex size-16 items-center justify-center rounded-lg bg-accent/16 text-accent"
          >
            <app-icon name="video" [size]="24" aria-hidden="true" />
          </span>
        }
        <span class="flex min-w-0 flex-1 flex-col text-start">
          <span class="truncate text-[13px]/[18px] text-text-primary">{{ file.file.name }}</span>
          <span dir="ltr" class="text-end text-[11px]/[14px] text-text-secondary">{{
            file.sizeText
          }}</span>
        </span>
        <button
          type="button"
          data-testid="remove-picked-media"
          class="text-[13px] font-medium text-error"
          [disabled]="isBusy()"
          (click)="clearFile()"
        >
          حذف
        </button>
      </div>
    } @else {
      <app-file-dropzone
        appearance="dashed"
        [prompt]="uploadCopy().prompt"
        [hint]="uploadCopy().hint"
        [accept]="accept()"
        [isMultiple]="false"
        (filesPicked)="onFilesPicked($event)"
      />
    }
    @if (fileError(); as error) {
      <p role="alert" class="text-start text-[12px]/[16px] text-error">{{ error }}</p>
    }
  </div>

  @if (isImage()) {
    <!-- RTL: the two lines lead on the right; the tick box sits in the 48px column on the left. -->
    <label
      class="flex h-16 cursor-pointer items-center justify-between gap-5 rounded-lg bg-[#f2f4f6] ps-[19px] pe-1.5"
    >
      <span class="flex flex-col gap-2 text-[12px]/[15px]">
        <span class="text-text-primary">تعيين كصورة رئيسية للمكان</span>
        <span class="text-text-secondary">ستظهر كأول صورة في بطاقة المكان</span>
      </span>
      <span class="flex w-12 justify-center">
        <input
          type="checkbox"
          data-testid="media-is-main"
          class="size-[18px] cursor-pointer rounded border border-[#94a3b8] accent-primary"
          [checked]="isMain()"
          (change)="toggleMain($event)"
        />
      </span>
    </label>
  }

  <!-- RTL: the blue action lands leftmost; its icon is written first to sit on the right. -->
  <button
    formDialogFooter
    type="button"
    data-testid="cancel-media"
    class="h-11 rounded-lg border border-border bg-surface px-5 text-[12px]/[16px] text-text-primary hover:bg-surface-muted"
    (click)="cancelled.emit()"
  >
    إلغاء
  </button>
  <button
    formDialogFooter
    type="button"
    data-testid="submit-media"
    class="flex h-11 w-[187px] items-center justify-center gap-2.5 rounded-lg border border-primary bg-primary px-5 text-[14px]/[14px] font-bold tracking-[0.5px] text-[#f8fafc] hover:bg-primary-hover disabled:cursor-not-allowed disabled:opacity-50"
    [disabled]="!canSubmit()"
    [attr.aria-busy]="isBusy()"
    (click)="submit()"
  >
    <app-icon name="add" [size]="20" aria-hidden="true" />
    <span>إضافة الوسائط</span>
  </button>
</app-form-dialog-frame>
