<app-auth-form-frame>
  <!-- Tall enough for the merchant tab (48 + 32 + 527px), so switching tabs never moves them. -->
  <div class="flex min-h-[607px] flex-col gap-8">
    <app-segmented-choice
      label="نوع الحساب"
      [options]="roleChoices"
      [selected]="activeRole()"
      (selectedChange)="selectRole($event)"
    />
    @if (activeRole() === 'merchant') {
      <app-merchant-sign-in-form />
    } @else {
      <app-admin-sign-in-form />
    }
  </div>
</app-auth-form-frame>
