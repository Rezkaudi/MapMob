<div class="flex flex-col items-start gap-4 text-right">
  @if (backLink(); as link) {
    <!-- The chevron is written first, so RTL puts it on the right of the words. -->
    <a
      [routerLink]="link"
      class="flex items-center gap-0.5 rounded text-[10px]/[24px] font-medium tracking-[0.5px] text-text-primary focus-visible:outline-2 focus-visible:outline-primary"
    >
      <app-icon name="chevron-right-thin" [size]="14" />
      العودة إلى تسجيل الدخول
    </a>
  }
  <h1 class="w-full text-[24px]/[24px] font-bold tracking-[0.5px] text-text-primary">
    {{ title() }}
  </h1>
  <p class="text-[16px]/[24px] text-text-secondary" [class]="descriptionClass()">
    {{ description() }}
  </p>
</div>
