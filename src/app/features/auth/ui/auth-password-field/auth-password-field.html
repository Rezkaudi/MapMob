<!-- `items-start` is the reading start, so RTL puts the label on the right edge. -->
<div class="flex w-full flex-col items-start gap-2">
  <label [for]="inputId()" [class]="labelClasses">{{ label() }}</label>
  <!-- RTL: the input leads on the right, so the eye toggle lands on the left. -->
  <div [class]="boxClasses">
    <input
      dir="ltr"
      [id]="inputId()"
      [type]="isPasswordVisible() ? 'text' : 'password'"
      [formControl]="control()"
      [placeholder]="placeholder"
      [attr.autocomplete]="autocomplete()"
      [class]="inputClasses"
    />
    <button
      type="button"
      class="flex rounded text-placeholder opacity-60 focus-visible:opacity-100 focus-visible:outline-2 focus-visible:outline-primary"
      [attr.aria-label]="toggleLabel()"
      [attr.aria-pressed]="isPasswordVisible()"
      (click)="togglePasswordVisibility()"
    >
      <app-icon [name]="isPasswordVisible() ? 'eye-outline' : 'eye-off'" [size]="16" />
    </button>
  </div>
</div>
