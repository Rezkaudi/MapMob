<section
  class="flex h-[320px] flex-col items-center gap-[17px] rounded-xl border border-border bg-surface pt-[23px] shadow-[0_4px_30px_0_rgba(238,238,238,0.8)]"
  [attr.aria-busy]="isLoading() ? 'true' : null"
>
  <h2 class="text-[18px]/[24px] font-bold text-[#3c3c41]">{{ title() }}</h2>

  @if (isLoading()) {
    <app-skeleton [width]="pieSizeInPixels" [height]="pieSizeInPixels" shape="circle" />
  } @else {
    <div class="relative" [style.width]="pieSizeInPixels" [style.height]="pieSizeInPixels">
      <svg
        role="group"
        [attr.aria-label]="title()"
        [attr.width]="pieSize"
        [attr.height]="pieSize"
        [attr.viewBox]="'0 0 ' + pieSize + ' ' + pieSize"
        (mouseleave)="hideTooltip()"
      >
        @for (slice of slices(); track slice.name) {
          <path
            role="img"
            tabindex="0"
            class="cursor-pointer outline-none transition-opacity duration-150"
            [attr.d]="slice.path"
            [attr.fill]="slice.color"
            [attr.opacity]="opacityOf(slice.index)"
            [attr.aria-label]="slice.spokenName"
            (mouseenter)="showTooltipFor(slice.index)"
            (mouseleave)="hideTooltip()"
            (focus)="showTooltipFor(slice.index)"
            (blur)="hideTooltip()"
          ></path>
        }
        @for (slice of slices(); track slice.name) {
          <text
            aria-hidden="true"
            class="pointer-events-none fill-white text-[13px]"
            text-anchor="middle"
            dominant-baseline="central"
            [attr.x]="slice.labelX"
            [attr.y]="slice.labelY"
          >
            {{ slice.name }}
          </text>
        }
      </svg>

      @if (hoveredSlice(); as hovered) {
        <div
          data-testid="category-share-tooltip"
          role="status"
          class="pointer-events-none absolute z-10 -translate-x-1/2 -translate-y-[calc(100%+8px)] whitespace-nowrap rounded-lg bg-[#3c3c41] px-3 py-1.5 text-[12px]/[18px] font-medium text-white shadow-[0_4px_12px_0_rgba(0,0,0,0.2)]"
          [style.left.px]="hovered.labelX"
          [style.top.px]="hovered.labelY"
        >
          {{ hovered.tooltipText }}
        </div>
      }
    </div>
  }
</section>
