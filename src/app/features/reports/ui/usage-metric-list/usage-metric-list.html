@if (isLoading()) {
  <div class="flex flex-col gap-4">
    @for (placeholder of placeholderRows; track placeholder) {
      <app-skeleton height="34px" />
    }
  </div>
} @else {
  <ul class="flex flex-col gap-4">
    @for (row of rows(); track row.label) {
      <li class="flex flex-col gap-1">
        <!-- RTL: the label on the right, the count and share on the left. -->
        <div class="flex h-[18px] items-center justify-between">
          <span data-role="label" class="text-[13px]/[18px] font-medium text-text-primary">{{
            row.label
          }}</span>
          <span class="flex items-start">
            <span
              data-role="value"
              dir="ltr"
              class="text-[14px]/[16px] font-medium text-[#191c1e]"
              >{{ row.valueText }}</span
            >
            <span data-role="share" dir="ltr" class="text-[12px]/[16px] text-[#717784]">{{
              row.shareText
            }}</span>
          </span>
        </div>
        <app-share-bar [share]="row.share" [tone]="row.tone" [label]="row.label" />
      </li>
    }
  </ul>
}
