<!-- RTL: the radio dot leads on the right, the words follow. -->
<button
  type="button"
  role="radio"
  class="flex size-full gap-2.5 rounded-xl text-start transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
  [class]="classes()"
  [attr.aria-checked]="isSelected()"
  (click)="picked.emit()"
>
  <app-radio-dot [isChecked]="isSelected()" />

  @if (description(); as descriptionText) {
    <span class="flex min-w-0 flex-col gap-[5.5px] pb-[3.5px]">
      <span data-role="title" class="text-[12px]/[16px] font-bold text-text-primary">{{
        title()
      }}</span>
      <span data-role="description" class="text-text-secondary" [class]="descriptionClasses()">
        {{ descriptionText }}
      </span>
    </span>
  } @else {
    <span data-role="title" class="text-[12px]/[16px]" [class]="titleClasses()">
      {{ title() }}
    </span>
  }
</button>
