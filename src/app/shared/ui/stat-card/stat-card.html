<div class="flex items-center gap-4 rounded-2xl border border-border bg-surface p-4">
  <span
    class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-primary text-white"
  >
    <ng-container [ngComponentOutlet]="icon()" [ngComponentOutletInputs]="{ size: 20 }" />
  </span>
  <div class="flex flex-col gap-1">
    <span class="text-sm text-text-secondary">{{ label() }}</span>
    <span class="text-2xl font-semibold text-text-primary">{{ value() }}</span>
  </div>
</div>
