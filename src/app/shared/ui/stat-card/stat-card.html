<!-- RTL puts the first child on the right: text on the right, icon tile on the left. -->
<div
  class="flex h-[82px] items-center justify-between gap-4 rounded-[15px] bg-surface px-4 shadow-[0_3.5px_5.5px_0_rgba(0,0,0,0.02)]"
>
  <div class="flex flex-col items-end justify-center gap-1.5 text-right">
    <span class="text-[12px]/[1.5] text-text-secondary">{{ label() }}</span>
    <span class="flex items-center gap-1">
      <span class="text-[18px]/[28px] font-bold text-text-primary">{{ value() }}</span>
      @if (delta(); as deltaLabel) {
        <span
          data-role="delta"
          class="flex items-center gap-0.5 rounded-2xl bg-status-success/16 px-1 py-0.5 text-[12px]/[16px] font-medium text-status-success"
        >
          <app-icon name="arrow-up" [size]="14" />
          {{ deltaLabel }}
        </span>
      }
    </span>
  </div>

  <span
    class="flex size-11 shrink-0 items-center justify-center rounded-xl bg-primary text-white shadow-[0_3.5px_5.5px_0_rgba(0,0,0,0.02)]"
  >
    <app-icon [name]="icon()" [size]="20" />
  </span>
</div>
