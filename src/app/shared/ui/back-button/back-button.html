<!-- RTL: the arrow points right, toward where the user came from. -->
<button
  type="button"
  class="flex h-11 items-center justify-center gap-2 rounded-lg border border-border bg-surface px-5 py-3 text-[16px]/[16px] font-bold text-text-primary transition-colors hover:border-primary hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
  (click)="goBack()"
>
  <app-icon name="arrow-right-curved" [size]="20" aria-hidden="true" />
  <span>الرجوع</span>
</button>
