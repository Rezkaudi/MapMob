<app-file-dropzone
  appearance="dashed"
  [prompt]="copy().prompt"
  [hint]="copy().hint"
  [accept]="accept()"
  [isMultiple]="false"
  (filesPicked)="pick($event)"
/>

@if (error(); as message) {
  <p role="alert" class="mt-2 text-start text-[12px]/[16px] text-closed">{{ message }}</p>
}

@if (image(); as picked) {
  <!-- 16px under the zone. RTL: the picture and its facts on the right, the two actions on the left. -->
  <div
    data-role="image-card"
    class="mt-4 flex items-center justify-between gap-4 rounded-xl border border-border bg-surface-muted/60 p-4"
  >
    <div class="flex min-w-0 items-center gap-4">
      @if (kind() === 'video') {
        <video
          class="h-14 w-20 shrink-0 rounded-lg border border-[#bfdbfe] object-cover"
          muted
          preload="metadata"
          [src]="picked.previewUrl"
        ></video>
      } @else {
        <img
          class="h-14 w-20 shrink-0 rounded-lg border border-[#bfdbfe] object-cover"
          [src]="picked.previewUrl"
          [alt]="picked.name"
        />
      }
      <div class="flex min-w-0 flex-col gap-px text-start">
        <p class="truncate text-[12px]/[16px] font-bold text-[#1e293b]" dir="auto">
          {{ picked.name }}
        </p>
        @if (summary()) {
          <p class="text-[11px]/[16.5px] text-[#94a3b8]">{{ summary() }}</p>
        }
      </div>
    </div>

    <div class="flex shrink-0 items-center gap-2">
      <button
        type="button"
        class="flex h-[30px] items-center gap-1.5 rounded-lg border border-border bg-white px-3 text-[12px]/[16px] font-bold text-[#334155] hover:bg-surface-muted"
        (click)="openReplacePicker()"
      >
        <app-icon name="refresh-thin" [size]="14" aria-hidden="true" />
        <span>{{ copy().replaceLabel }}</span>
      </button>
      <button
        type="button"
        class="flex h-[30px] items-center gap-1.5 rounded-lg border border-status-error px-3 text-[12px]/[16px] font-bold text-status-error hover:bg-status-error/5"
        (click)="remove()"
      >
        <app-icon name="trash-outline" [size]="14" aria-hidden="true" />
        <span>حذف</span>
      </button>
    </div>
    <input
      #replaceInput
      type="file"
      class="sr-only"
      tabindex="-1"
      aria-hidden="true"
      [attr.accept]="accept()"
      (change)="pickFromInput($event)"
    />
  </div>
}
