<span role="status" [attr.aria-label]="label()" class="inline-flex items-center justify-center">
  <span
    data-role="circle"
    aria-hidden="true"
    class="inline-block animate-spin rounded-full border-current border-t-transparent"
    [style.width]="sizeInPixels()"
    [style.height]="sizeInPixels()"
    [style.borderWidth]="borderWidthInPixels()"
  ></span>
</span>
