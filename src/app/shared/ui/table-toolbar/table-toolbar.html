<!-- RTL order: search on the right, then the sort field, with the filter button on the left. -->
<div
  class="flex w-full items-center justify-end gap-2 rounded-xl border border-border bg-surface p-4"
>
  <div class="relative h-10 w-[390px]">
    <input
      type="search"
      class="h-10 w-full rounded-lg border border-text-secondary py-3 pr-[41px] pl-[17px] text-right text-sm text-text-primary outline-none placeholder:text-text-primary"
      [placeholder]="searchPlaceholder()"
      (input)="onInput($event)"
    />
    <app-icon
      name="search"
      [size]="15"
      class="absolute end-[13px] top-1/2 -translate-y-1/2 text-text-secondary"
    />
  </div>

  <button
    type="button"
    class="flex h-10 w-[139px] items-center justify-between rounded-lg border border-text-secondary px-[13px] text-sm text-text-primary"
  >
    <span>ترتيب حسب</span>
    <app-icon name="sort" [size]="14" class="text-text-secondary" />
  </button>

  <button
    type="button"
    class="flex items-center gap-2.5 rounded-xl border border-primary bg-[#f0f7fe] px-[17px] py-[11px] text-[14px]/[20px] font-bold text-primary"
  >
    <span>الفلاتر</span>
    <app-icon name="filter" [size]="14" />
  </button>
</div>
