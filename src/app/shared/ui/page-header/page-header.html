<!-- RTL: the title block sits on the right, the page action on the left. -->
<div class="flex items-center justify-between gap-4">
  <div class="flex flex-col gap-1 text-start">
    <h1 class="text-[28px]/[34px] font-bold text-black">{{ title() }}</h1>
    <p class="whitespace-pre-wrap text-text-secondary" [class]="descriptionClasses()">
      {{ description() }}
    </p>
  </div>

  @if (isAddVisible() || isExportVisible()) {
    <div data-role="page-actions" class="flex items-center gap-2">
      @if (isAddVisible()) {
        <app-add-button [label]="addLabel()" (pressed)="add.emit()" />
      }
      @if (isExportVisible()) {
        <app-export-button [isBusy]="isExporting()" (pressed)="exportRequested.emit()" />
      }
    </div>
  }
  <ng-content select="[pageHeaderAction]" />
</div>
