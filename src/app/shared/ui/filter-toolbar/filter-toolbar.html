<!-- RTL: the 390px search on the right; sort then "الفلاتر" on the left. The 74px bar counts its border, so 15px pads it. -->
<div
  class="flex items-center justify-between gap-4 rounded-xl border border-border bg-surface px-4 py-[15px]"
>
  <app-list-search-field
    class="w-full max-w-[390px]"
    [placeholder]="searchPlaceholder()"
    (searchChange)="searchChange.emit($event)"
  />

  <div class="flex shrink-0 items-center" [style.gap.px]="controlGap()">
    <app-sort-select (sortChange)="sortChange.emit($event)" />

    <div class="relative">
      <button
        type="button"
        class="flex h-[42px] items-center gap-2.5 rounded-xl border border-primary bg-[#f0f7fe] px-4 text-[14px]/[20px] font-bold text-primary hover:bg-primary-soft"
        [attr.aria-controls]="panelId()"
        [attr.aria-expanded]="isFilterPanelOpen()"
        [attr.aria-label]="filterButtonLabel()"
        (click)="toggleFilterPanel()"
      >
        <app-icon name="filter" [size]="14" aria-hidden="true" />
        <span>الفلاتر</span>
      </button>

      @if (isFilterPanelOpen()) {
        <!-- Lined up with the button's left edge; each panel adds its own small offset. -->
        <div class="absolute top-full left-0 z-30">
          <ng-container *ngTemplateOutlet="filterPanel(); context: panelContext" />
        </div>
      }
    </div>
  </div>
</div>
