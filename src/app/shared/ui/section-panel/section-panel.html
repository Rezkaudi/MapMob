<!--
  RTL: the heading block comes first so it sits on the right, the action button on the
  left. Figma draws the 24px padding inside the 1px stroke; CSS adds the border outside
  it, so the padding is 23px to land the content where the frame does.
-->
<section
  class="flex flex-col gap-5 rounded-2xl border border-[rgba(226,232,240,0.8)] bg-surface p-[23px] shadow-[0_4px_31px_0_rgba(0,0,0,0.08)]"
>
  <header class="flex items-center justify-between gap-4 border-b border-[#f1f5f9] pb-4">
    <div class="flex flex-col gap-1 text-start">
      <div class="flex items-center gap-2">
        <h2 class="text-[16px]/[24px] font-bold text-text-primary">{{ heading() }}</h2>
        @if (badge()) {
          <span
            data-testid="section-badge"
            class="flex h-5 items-center rounded-full bg-[#f1f5f9] px-2 text-[12px]/[16px] font-bold text-text-secondary"
          >
            {{ badge() }}
          </span>
        }
      </div>
      @if (subtitle()) {
        <p class="text-[11px]/[16.5px] text-text-secondary">{{ subtitle() }}</p>
      }
    </div>

    @if (actionLabel()) {
      <!-- RTL: the icon leads, so it lands on the right edge of the button. -->
      <button
        type="button"
        class="flex h-7 shrink-0 items-center gap-1.5 rounded bg-primary px-3.5 text-[12px]/[16px] font-bold text-white shadow-[0_1px_2px_0_rgba(5,131,236,0.2)] transition-colors hover:bg-primary-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
        (click)="action.emit()"
      >
        <app-icon [name]="actionIcon()" aria-hidden="true" [size]="14" />
        <span>{{ actionLabel() }}</span>
      </button>
    }
  </header>

  <div>
    <ng-content />
  </div>
</section>
