<!-- The ad form keeps its bold labels 5px above the control; the offer form uses 4px. -->
<div class="flex flex-col" [class]="isLabelBold() ? 'gap-[5px]' : 'gap-1'">
  <!-- Flex keeps the 11px star from making the line taller than the label. RTL: the counter sits left. -->
  <div class="flex items-start justify-between gap-2">
    <label
      class="flex items-start gap-0.5 text-start text-[14px] text-text-primary"
      [class]="isLabelBold() ? 'leading-4 font-bold' : 'leading-[14px]'"
      [attr.for]="forId() || null"
    >
      {{ label() }}
      @if (isRequired()) {
        <span class="text-[11px]/[14px] font-medium text-closed" aria-hidden="true">*</span>
      }
    </label>
    @if (counter()) {
      <span dir="ltr" class="text-[14px]/[16px] text-text-secondary">{{ counter() }}</span>
    }
  </div>

  <ng-content />

  @if (error(); as message) {
    <p role="alert" class="text-start text-[12px]/[16px] text-closed">{{ message }}</p>
  } @else if (hint()) {
    <p class="text-start text-[11px]/[16.5px] text-text-secondary">{{ hint() }}</p>
  }
</div>
