<!--
  RTL: in every row the first child sits on the right, as the frame draws it.
  23px padding plus the 1px border keeps the frame's 168px card.
-->
<section
  class="flex h-full min-h-[168px] flex-col justify-between gap-[18px] rounded-lg border border-border bg-surface p-[23px] shadow-[0_2px_30px_0_rgba(0,0,0,0.05)]"
>
  <div data-role="top-row" class="flex items-start justify-between gap-4 pb-2">
    <div data-role="heading" class="flex min-w-0 flex-col">
      <div data-role="heading-row" class="flex items-center" [class]="headingGapClass()">
        <h2 data-role="title" class="text-[18px]/[28px] font-bold text-[#191c1e]">
          {{ title() }}
        </h2>
        <span
          data-role="plan"
          class="rounded-xl bg-text-secondary px-2 py-1 text-[12px]/[14px] whitespace-nowrap text-white"
          >{{ planName() }}</span
        >
      </div>
      <p data-role="notice" class="pt-0.5 text-[12px]/[18px] text-text-secondary">
        {{ quota().notice }}
      </p>
    </div>

    <a
      data-role="upgrade"
      [routerLink]="subscriptionRoute"
      class="flex shrink-0 items-center gap-1 rounded bg-primary-tint px-3 py-1 text-[12px]/[16px] text-primary hover:bg-primary/25 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
    >
      <app-icon name="award-rosette" [size]="14" aria-hidden="true" />
      <span>ترقية الباقة</span>
    </a>
  </div>

  <div class="flex flex-col gap-1">
    <div data-role="usage-row" class="flex items-center justify-between gap-4">
      <p data-role="usage" class="flex items-center gap-1">
        <span
          data-role="used-count"
          class="text-[24px]/[32px] font-bold tracking-[-0.24px] text-primary"
          >{{ quota().usedCount }}</span
        >
        <span data-role="limit" class="text-[14px]/[20px] text-text-primary">{{
          quota().limitText
        }}</span>
      </p>
      <span
        data-role="remaining"
        class="rounded-xl px-3 py-1 text-[12px]/[14px] whitespace-nowrap text-white"
        [class]="chipBackground()"
        >{{ quota().remainingChipText }}</span
      >
    </div>
    <!-- A block child starts on the right in RTL, so the used share fills from the right. -->
    <div
      role="progressbar"
      [attr.aria-label]="barLabel()"
      aria-valuemin="0"
      aria-valuemax="100"
      class="h-2.5 overflow-hidden rounded-xl bg-border"
      [attr.aria-valuenow]="quota().usedPercent"
    >
      <div class="h-full rounded-xl bg-primary" [style.width.%]="quota().usedPercent"></div>
    </div>
  </div>
</section>
