<!-- RTL order: the range sits on the right, the controls on the left, with "التالي" nearest the pages. -->
<div class="flex h-14 items-center justify-between px-2 py-4">
  <p class="text-[14px]/[21px] font-medium text-text-primary">
    عرض {{ rangeStart() }}- {{ rangeEnd() }} من {{ totalCount() }} {{ itemNoun() }}
  </p>

  <div class="flex items-center gap-3">
    <button
      type="button"
      class="rounded border border-primary px-[5px] py-[5px] text-[12px]/[18px] font-medium text-primary disabled:cursor-not-allowed disabled:opacity-40"
      [disabled]="isLastPage()"
      (click)="goTo(pageIndex() + 1)"
    >
      التالي
    </button>

    <div class="flex items-center gap-1">
      @for (step of pageSteps(); track $index) {
        @if (step === gap) {
          <span
            data-role="page-gap"
            class="px-1 text-[16px]/[24px] text-text-secondary"
            aria-hidden="true"
            >…</span
          >
        } @else {
          <button
            type="button"
            data-role="page-step"
            class="flex items-center justify-center rounded-lg text-[12px]/[16px]"
            [class]="
              step === pageIndex()
                ? 'size-6 bg-primary font-bold text-white'
                : 'size-8 text-text-secondary'
            "
            [attr.aria-current]="step === pageIndex() ? 'page' : null"
            [attr.aria-label]="'صفحة ' + (step + 1)"
            (click)="goTo(step)"
          >
            {{ step + 1 }}
          </button>
        }
      }
    </div>

    <button
      type="button"
      class="rounded border border-text-secondary px-[5px] py-[5px] text-[12px]/[18px] font-medium text-text-secondary disabled:cursor-not-allowed disabled:opacity-40"
      [disabled]="isFirstPage()"
      (click)="goTo(pageIndex() - 1)"
    >
      السابق
    </button>
  </div>
</div>
