<!-- The picture sits 8px above the title; the title sits 4px above the description. -->
<section
  class="flex flex-col gap-2 rounded-xl border border-[#f1f5f9] bg-surface-muted p-4 text-start"
>
  @if (imageUrl(); as url) {
    <img [src]="url" alt="" class="h-[174px] w-full rounded-xl object-cover" />
  }
  <div class="flex flex-col gap-1">
    <h3 class="text-[16px]/[24px] font-bold text-text-primary">{{ title() }}</h3>
    @if (description(); as text) {
      <p class="text-[12px]/[16px] text-text-secondary">{{ text }}</p>
    }
  </div>
</section>
