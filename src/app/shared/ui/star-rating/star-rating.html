<!-- LTR by default, so the filled stars start from the left, as most designs draw them. -->
<span
  role="img"
  class="flex items-center"
  [attr.dir]="fillDirection()"
  [style.gap.px]="gap()"
  [attr.aria-label]="spokenRating()"
>
  @for (starClass of stars(); track $index) {
    <app-icon [name]="look().icon" [size]="starSize()" [class]="starClass" aria-hidden="true" />
  }
</span>
