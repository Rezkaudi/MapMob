<!-- The offers design centres this 550px block on the area under the top bar. -->
<div class="flex w-[550px] max-w-full flex-col items-center gap-10 text-center">
  <div class="flex flex-col items-center gap-4">
    <h2 class="text-[24px]/[29px] font-bold text-black">{{ title() }}</h2>
    <p class="text-[24px]/[29px] text-text-secondary">{{ description() }}</p>
  </div>
  <app-add-button [label]="addLabel()" (pressed)="add.emit()" />
</div>
