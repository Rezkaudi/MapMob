<!-- RTL: the chips start at the right edge of the card, as the design lays them out. -->
<div class="flex items-center gap-4">
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="flex h-7 items-center justify-center gap-2 rounded-md px-2"
      [class]="
        option.value === selected()
          ? 'bg-accent font-bold text-white'
          : 'border border-border bg-surface-muted font-medium text-text-primary'
      "
      [attr.aria-pressed]="option.value === selected()"
      (click)="selectedChange.emit(option.value)"
    >
      @if (option.dotClass) {
        <span class="size-2 rounded-full" [class]="option.dotClass"></span>
      }
      <span class="text-[14px]/[21px]">{{ option.label }}</span>
      <span class="text-[14px]/[21px]">({{ option.count }})</span>
    </button>
  }
</div>
