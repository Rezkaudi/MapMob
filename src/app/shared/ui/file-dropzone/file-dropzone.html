<label
  class="relative flex cursor-pointer flex-col items-center justify-center rounded-xl border-dashed text-center transition-colors"
  [class]="zoneClasses()"
  [class.gap-2]="appearance() === 'soft'"
  [class.rounded-lg]="appearance() === 'dashed'"
  (dragenter)="onDragOver($event)"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  @if (appearance() === 'dashed') {
    <!-- RTL: the prompt reads first on the right, the blue link ends the line. -->
    <app-icon name="upload-cloud-outline" [size]="32" class="text-text-secondary" />
    <span data-role="prompt" class="pb-1 text-[14px]/[20px] text-text-secondary">
      {{ prompt() }} أو <span class="font-medium text-primary">استعرض الملفات</span>
    </span>
    @if (hint()) {
      <span class="text-[11px]/[14px] text-text-secondary">{{ hint() }}</span>
    }
  } @else {
    <app-icon name="upload-cloud" [size]="28" class="text-text-secondary" />
    <span class="text-[14px] text-text-secondary">
      <span class="font-medium text-primary">استعرض الملفات</span>
      أو {{ prompt() }}
    </span>
    @if (hint()) {
      <span class="text-[12px] text-placeholder">{{ hint() }}</span>
    }
  }
  <input
    type="file"
    class="sr-only"
    [multiple]="isMultiple()"
    [attr.accept]="accept() || null"
    (change)="onPick($event)"
  />
</label>
