<!--
  560px modal from the ADD PRODUCT frame: 90px header, 24px-padded body with a
  20px gap between fields, and a tinted footer. RTL puts the heading on the right
  and the close button on the left.
-->
<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-[rgba(25,28,29,0.3)] p-4 backdrop-blur-[2px]"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="titleId"
  (click)="closed.emit()"
>
  <div
    data-role="dialog-card"
    class="flex max-h-full flex-col overflow-hidden rounded-2xl bg-surface shadow-[0_25px_50px_-12px_rgba(0,0,0,0.25)]"
    [class]="sizeSkin().card"
    (click)="$event.stopPropagation()"
  >
    <header class="flex justify-between gap-4 px-6 py-5" [class]="sizeSkin().header">
      <div class="text-start">
        <h2 [id]="titleId" class="text-[18px]/[28px] text-text-primary" [class]="skin().heading">
          {{ heading() }}
        </h2>
        @if (subheading(); as line) {
          <p class="text-text-secondary" [class]="skin().subheading">{{ line }}</p>
        }
      </div>
      <button
        type="button"
        data-role="close-dialog"
        class="flex size-9 shrink-0 items-center justify-center rounded-lg hover:bg-surface-muted"
        [class]="skin().closeButton"
        aria-label="إغلاق النافذة"
        (click)="closed.emit()"
      >
        <app-icon name="close" [size]="18" />
      </button>
    </header>

    <div data-role="dialog-body" class="flex flex-col overflow-y-auto" [class]="sizeSkin().body">
      <ng-content />
    </div>

    <!-- RTL: `justify-end` packs the buttons against the left edge, so the last one lands leftmost. -->
    @if (hasFooter()) {
      <footer class="mt-1 flex items-center justify-end gap-3 bg-[rgba(242,244,246,0.5)] px-6 py-4">
        <ng-content select="[formDialogFooter]" />
      </footer>
    }
  </div>
</div>
