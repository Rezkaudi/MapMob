<!-- RTL: the list page leads on the right, then the chevron, then this page. The title sits 16px below. -->
<nav
  aria-label="مسار الصفحة"
  class="flex items-center gap-1 text-[14px]/[14px] font-medium tracking-[0.14px]"
>
  <a class="text-text-secondary hover:text-primary" [routerLink]="parentLink()">{{
    parentLabel()
  }}</a>
  <app-icon name="chevron-left-small" [size]="8" class="text-text-secondary" aria-hidden="true" />
  <span class="text-text-primary" aria-current="page">{{ crumbLabel() }}</span>
</nav>
<!-- RTL: the title block on the right, an optional page action on the left. -->
<div
  data-role="heading-row"
  class="mt-4 flex justify-between gap-4"
  [class]="appearanceClasses().row"
>
  <div class="flex flex-col gap-1 text-start">
    <h1 class="font-bold" [class]="appearanceClasses().title">{{ title() }}</h1>
    @if (description()) {
      <p class="text-text-secondary" [class]="descriptionClasses()">{{ description() }}</p>
    }
    <ng-content select="[pageHeadingMeta]" />
  </div>
  <ng-content select="[pageHeadingAction]" />
</div>
