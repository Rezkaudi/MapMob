<app-dialog-frame
  heading="رمز QR للمتجر"
  subheading="امسح الرمز للوصول مباشرة إلى صفحة المتجر على MapMob"
  appearance="light"
  (closed)="closed.emit()"
>
  <div
    class="relative mx-auto flex size-64 items-center justify-center rounded-2xl border border-border bg-linear-to-b from-white to-surface-muted"
  >
    @for (corner of scanCorners; track corner) {
      <span
        data-role="scan-corner"
        aria-hidden="true"
        class="absolute size-3 border-[#cbd5e1]"
        [class]="corner"
      ></span>
    }
    <svg
      class="block size-32 text-[#2b2b2b]"
      role="img"
      shape-rendering="crispEdges"
      [attr.viewBox]="'0 0 ' + code().moduleCount + ' ' + code().moduleCount"
      [attr.aria-label]="code().label"
    >
      <path fill="currentColor" [attr.d]="code().path" />
    </svg>
  </div>

  <div class="flex flex-col gap-2">
    <label for="store-qr-dialog-link" class="text-[13px]/[15px] font-bold text-[#334155]">
      رابط المتجر المباشر
    </label>
    <!-- The copy chip sits on the left, where the frame draws it inside the field. -->
    <div class="relative">
      <input
        id="store-qr-dialog-link"
        class="block h-12 w-full truncate rounded-xl border border-border bg-surface-muted pr-4 pl-[84px] text-right font-mono text-[13px]/[18px] text-[#334155] focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-primary"
        dir="ltr"
        readonly
        [value]="code().url"
      />
      <!-- RTL: the icon comes first so it sits to the right of "نسخ". -->
      <button
        data-role="copy"
        type="button"
        class="absolute top-1/2 left-2 flex h-8 -translate-y-1/2 items-center gap-1.5 rounded-lg border border-border bg-white px-2.5 text-[13px]/[18px] text-text-primary transition-colors hover:bg-surface-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
        (click)="copyLink()"
      >
        <app-icon
          aria-hidden="true"
          [class.text-success]="copiedNotice.isVisible()"
          [name]="copiedNotice.isVisible() ? 'check-thin' : 'copy-squares'"
          [size]="14"
        />
        <span>{{ copiedNotice.isVisible() ? 'تم النسخ' : 'نسخ' }}</span>
      </button>
    </div>
  </div>

  <!-- RTL: download comes first so it lands on the right. -->
  <button
    dialogFooter
    data-role="download"
    type="button"
    class="flex h-10 flex-1 items-center justify-center gap-2 rounded-lg border border-transparent bg-primary text-[14px]/[20px] font-bold text-white shadow-[0_1px_2px_0_rgba(0,0,0,0.05)] transition-colors hover:bg-primary-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
    (click)="download()"
  >
    <app-icon name="download-tray" aria-hidden="true" [size]="16" />
    <span>تحميل QR (PNG)</span>
  </button>
  <button
    dialogFooter
    data-role="print"
    type="button"
    class="flex h-10 flex-1 items-center justify-center rounded-lg border border-text-secondary bg-white text-[14px]/[20px] font-bold text-text-primary transition-colors hover:bg-surface-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
    (click)="print()"
  >
    طباعة QR
  </button>
</app-dialog-frame>
