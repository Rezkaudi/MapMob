<section
  class="flex flex-col gap-4 rounded-2xl border border-border bg-white p-5"
  [attr.aria-labelledby]="idPrefix + '-title'"
>
  <header class="flex flex-col items-start gap-0.5">
    <h2 class="text-[16px]/[24px] font-bold text-[#1e293b]" [id]="idPrefix + '-title'">
      رمز المتجر
    </h2>
    <p class="font-cairo text-[12px]/[16px] text-text-secondary">{{ caption }}</p>
  </header>

  <div class="flex justify-center pt-1">
    <div
      class="rounded-2xl border-2 border-dashed border-border bg-white px-4 py-2 shadow-[inset_0_2px_4px_2px_rgba(0,0,0,0.05)]"
    >
      <div class="size-[120px] rounded-xl bg-white p-2 text-[#2b2b2b]">
        <svg
          class="block size-full"
          role="img"
          shape-rendering="crispEdges"
          [attr.viewBox]="'0 0 ' + code().moduleCount + ' ' + code().moduleCount"
          [attr.aria-label]="code().label"
        >
          <path fill="currentColor" [attr.d]="code().path" />
        </svg>
      </div>
    </div>
  </div>

  <div class="flex flex-col gap-1 pt-1">
    <label
      class="font-cairo text-[11px]/[16.5px] font-semibold text-text-secondary"
      [for]="idPrefix + '-link'"
    >
      رابط المتجر المباشر
    </label>
    <!-- The copy button sits on the left, where the frame draws it inside the field. -->
    <div class="relative">
      <input
        class="block h-[38px] w-full truncate rounded border border-border bg-surface-muted py-2.5 pr-3 pl-10 text-right font-mono text-[12px]/[16px] text-[#334155] focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-primary"
        dir="ltr"
        readonly
        [id]="idPrefix + '-link'"
        [value]="code().displayUrl"
      />
      <button
        data-role="copy"
        type="button"
        class="absolute top-1/2 left-3 flex -translate-y-1/2 rounded-sm transition-colors after:absolute after:-inset-2 hover:text-text-secondary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
        [class.text-success]="copiedNotice.isVisible()"
        [class.text-[#94a3b8]]="!copiedNotice.isVisible()"
        [attr.aria-label]="copiedNotice.isVisible() ? 'تم نسخ الرابط' : 'نسخ الرابط'"
        (click)="copyLink()"
      >
        <app-icon
          aria-hidden="true"
          [name]="copiedNotice.isVisible() ? 'check-thin' : 'copy-squares'"
          [size]="16"
        />
      </button>
    </div>
  </div>

  <div class="flex flex-col gap-2">
    <!-- RTL: the icon comes first so it sits to the right of the label. -->
    <button
      data-role="download"
      type="button"
      class="flex items-center justify-center gap-2 rounded bg-primary px-4 py-2.5 font-cairo text-[12px]/[16px] font-bold text-white shadow-[0_1px_2px_0_rgba(0,0,0,0.05)] transition-colors hover:bg-primary-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
      (click)="download()"
    >
      <app-icon name="download-tray" aria-hidden="true" [size]="16" />
      <span>تحميل QR</span>
    </button>
    <button
      data-role="print"
      type="button"
      class="flex items-center justify-center rounded border border-border bg-white px-4 py-2 font-cairo text-[12px]/[16px] font-semibold text-text-primary transition-colors hover:bg-surface-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
      (click)="print()"
    >
      طباعة
    </button>
  </div>
</section>
