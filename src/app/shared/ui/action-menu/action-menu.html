<div class="inline-block">
  <button
    #trigger
    type="button"
    class="rounded-md px-1 pt-1 pb-[11px] text-text-secondary hover:bg-surface-muted"
    aria-haspopup="true"
    [attr.aria-expanded]="isOpen()"
    (click)="toggle()"
  >
    <app-icon name="more-vertical" [size]="14" />
  </button>

  @if (isOpen()) {
    <div
      data-testid="action-menu-panel"
      class="z-40 w-48 rounded-xl border border-border bg-surface p-[5px] shadow-[0_8px_24px_rgba(15,23,42,0.12)]"
      style="position: fixed"
      [style.left.px]="position().left"
      [style.top.px]="position().top"
      [style.bottom.px]="position().bottom"
    >
      <ng-content />
    </div>
  }
</div>
