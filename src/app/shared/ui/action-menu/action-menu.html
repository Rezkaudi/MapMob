<div class="inline-block">
  <button
    #trigger
    type="button"
    class="rounded-md px-1 pt-1 pb-[11px] hover:bg-surface-muted"
    [class]="skin().trigger"
    aria-haspopup="true"
    [attr.aria-expanded]="isOpen()"
    (click)="toggle()"
  >
    <app-icon name="more-vertical" [size]="14" />
  </button>

  @if (isOpen()) {
    <div
      data-testid="action-menu-panel"
      class="z-40 w-48 border border-border bg-surface"
      style="position: fixed"
      [class]="skin().panel"
      [style.left.px]="position().left"
      [style.top.px]="position().top"
      [style.bottom.px]="position().bottom"
      (click)="closeAfterPick()"
    >
      <ng-content />
    </div>
  }
</div>
