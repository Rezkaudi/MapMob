<div class="relative inline-block">
  <button
    type="button"
    class="rounded-md px-1 pt-1 pb-[11px] text-text-secondary hover:bg-surface-muted"
    aria-haspopup="true"
    [attr.aria-expanded]="isOpen()"
    (click)="toggle()"
  >
    <app-icon name="more-vertical" [size]="14" />
  </button>

  @if (isOpen()) {
    <div
      class="absolute end-0 z-10 mt-1 w-40 rounded-xl border border-border bg-surface py-1 shadow-lg"
    >
      <ng-content />
    </div>
  }
</div>
