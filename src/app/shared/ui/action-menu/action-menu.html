<div class="relative inline-block">
  <button
    type="button"
    class="rounded-lg p-1.5 hover:bg-surface-muted"
    aria-haspopup="true"
    [attr.aria-expanded]="isOpen()"
    (click)="toggle()"
  >
    <svg lucideMoreVertical class="h-4 w-4 text-text-secondary"></svg>
  </button>

  @if (isOpen()) {
    <div
      class="absolute end-0 z-10 mt-1 w-40 rounded-xl border border-border bg-surface py-1 shadow-lg"
    >
      <ng-content />
    </div>
  }
</div>
