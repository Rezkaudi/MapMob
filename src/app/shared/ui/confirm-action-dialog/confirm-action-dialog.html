<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-[rgba(25,28,29,0.3)] p-6 backdrop-blur-[2px]"
  role="dialog"
  aria-modal="true"
  aria-labelledby="confirm-action-title"
  (click)="cancelled.emit()"
>
  <div
    class="flex w-full max-w-[448px] flex-col items-center rounded-xl bg-white p-8 text-center shadow-[0_10px_15px_-3px_rgba(0,0,0,0.1),0_4px_6px_-4px_rgba(0,0,0,0.1)]"
    (click)="$event.stopPropagation()"
  >
    <div data-role="confirm-icon" [class]="iconSpacing()">
      <span class="flex size-16 items-center justify-center rounded-full" [class]="skin().halo">
        <app-icon [name]="skin().icon" [size]="skin().iconSize" aria-hidden="true" />
      </span>
    </div>

    <h2 id="confirm-action-title" class="text-[24px]/[31.2px] font-bold text-[#191c1d]">
      {{ copy().title }}
    </h2>
    <p class="text-[16px]/[24px] text-text-secondary" [class]="questionClasses()">
      {{ copy().question }}
    </p>
    @if (copy().context; as context) {
      <!-- RTL: the picture leads on the right. 11px padding plus the border keeps the frame's 68px. -->
      <div
        data-role="confirm-context"
        class="mt-1 flex items-center gap-3 rounded border border-border p-[11px] text-start"
        [class]="boxWidth()"
      >
        <span
          data-role="context-picture"
          class="size-11 shrink-0 overflow-hidden rounded-lg bg-[#eceef0]"
        >
          @if (context.imageUrl; as imageUrl) {
            <img [src]="imageUrl" alt="" class="size-full object-cover" />
          }
        </span>
        <span class="flex min-w-0 flex-1 flex-col gap-0.5 text-[14px]/[20px] text-[#1e293b]">
          @for (line of context.lines; track line) {
            <span data-role="context-line" class="truncate">{{ line }}</span>
          }
        </span>
      </div>
    }
    <p data-role="confirm-detail" [class]="detailClasses()">{{ copy().detail }}</p>

    <!-- RTL: the coloured action sits on the right, cancel on the left. -->
    <div class="flex w-full items-start gap-4" [class]="actionsClasses()">
      <button
        type="button"
        class="h-10 flex-1 rounded-lg px-6 text-[14px]/[14px] font-bold text-white transition-colors disabled:cursor-not-allowed disabled:opacity-60"
        [class]="skin().confirm"
        [disabled]="isBusy()"
        [attr.aria-busy]="isBusy()"
        (click)="confirmed.emit()"
      >
        {{ copy().confirmLabel }}
      </button>
      <button
        type="button"
        class="h-10 flex-1 rounded-lg border border-border bg-[#f8f9fa] px-6 text-[14px]/[14px] text-text-primary hover:bg-surface-muted"
        (click)="cancelled.emit()"
      >
        إلغاء
      </button>
    </div>
  </div>
</div>
