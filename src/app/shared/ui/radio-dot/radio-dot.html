@if (isChecked()) {
  <span
    data-role="radio-dot"
    class="flex size-[18px] items-center justify-center rounded-full bg-primary"
    aria-hidden="true"
  >
    <span class="size-1.5 rounded-full bg-white"></span>
  </span>
} @else {
  <span
    data-role="radio-dot"
    class="size-4 rounded-full border border-[#6b7280] bg-white"
    aria-hidden="true"
  ></span>
}
