<!-- RTL: the history icon is written first, so it sits on the right of the word. -->
<span
  data-role="status"
  class="flex h-6 items-center gap-1 rounded-xl px-2 text-[12px]/[16px] whitespace-nowrap"
  [class]="skin().pill"
>
  @if (skin().hasHistoryIcon) {
    <app-icon name="history" [size]="10" aria-hidden="true" />
  }
  <span>{{ label() }}</span>
</span>
