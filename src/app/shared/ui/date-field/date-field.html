<label class="flex flex-col gap-1">
  <span class="text-[11px]/[16.5px] font-bold text-text-secondary">{{ label() }}</span>
  <!-- RTL: the calendar sits at the right end; the day reads left-to-right from the left end. -->
  <span
    class="relative flex h-[30px] items-center rounded-lg border border-border bg-white pr-8 pl-2 focus-within:border-primary"
  >
    @if (value(); as day) {
      <span
        data-role="date-text"
        dir="ltr"
        class="flex-1 text-left text-[12px]/[16px] font-bold text-text-primary"
      >
        {{ day }}
      </span>
    } @else {
      <span class="flex-1 text-start text-[12px]/[16px] text-[#94a3b8]">اختر التاريخ</span>
    }
    <app-icon
      name="calendar-outline"
      [size]="14"
      class="pointer-events-none absolute right-1 top-1/2 flex w-[22px] -translate-y-1/2 justify-center text-text-secondary"
      aria-hidden="true"
    />
    <input
      type="date"
      class="absolute inset-0 size-full cursor-pointer opacity-0"
      [attr.aria-label]="label()"
      [value]="value() ?? ''"
      [attr.min]="min()"
      [attr.max]="max()"
      (click)="openPicker($event)"
      (change)="onChange($event)"
    />
  </span>
</label>
